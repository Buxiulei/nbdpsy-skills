<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>tpl-cover-jinjin</title>
<!--
  「通栏大字压顶 · 递进三行」封面模板（老板 2026-08-16 验收版式的确定性复刻）

  ⛔ 这个文件里不写任何一句文案 —— 全部由 render_cover.py 把 JSON 注入
     下面那个 <script id="cover-data"> 占位符。改文案 = 改 JSON，版式分毫不动。

  版式自上而下（⛔ 不许自创层次，也⛔ 不许加 01/02/03 装饰序号）：
    ① 通栏大字压顶（hero，**只放最扎心的那句短句**，1–2 行）
    ② 副题（subtitle，加粗墨蓝，= hero × 0.34；可空，空了自动退化回三级字阶）
    ③ 递进三行（前两行小圆点 + 鼠尾草绿虚线相连；第三行赭红箭头 + 加粗 = 结论行）
    ④ 咨询师真人头像（圆形、鼠尾草绿细描边）+ 身份两行
    ⑤ 右下陪衬 SVG（≤ 画面宽 20%，不与头像争）
    ⑥ 底部落款

  四级字阶（2026-08-17 老板拍板「方案 1」后定稿，⛔ 别再退回两级）：
    hero(1.00·赭红 Heavy) → subtitle(0.34·墨蓝加粗) → steps 前两条(≤subtitle·灰蓝常规)
    → 第三条结论行(同字号·赭红加粗)。级差一半靠字号、一半靠字重与颜色。
    0.34 是 illustration-spec §2-b 给 **support/副题** 定的系数——首版没有副题层、
    把它误套给递进行才导致弃用；现在它有正主了。hero:subtitle ≈ 2.94:1，
    满足该节「hero:support ≥ 2.5:1」硬下限。

  自适应引擎见文末 <script>：hero 一次线性测量求"恰好撑满版心"的字号，
  递进行二分求"不溢出的最大字号"，剩余空白由 flex spacer 自动均分。
-->
<script id="cover-data" type="application/json">__COVER_DATA__</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    /* —— 画布 —— */
    --w: 876px;  --h: 1313px;
    --pad-x: 60px; --pad-top: 114px; --pad-bottom: 76px;
    --step-indent: 46px;   /* 递进区相对 hero 的缩进 = 层级由位置表达 */

    /* —— 我们自己的调色板（⛔ 不出现表外颜色）—— */
    --bg:     #E8D8C4;   /* 暖米白纸纹（品牌色本体，⛔ 不许换 hex）*/
    /* 纸面受光：往暖白 #FFF6E9 兑 40%，把成图底色从 #EADDCC 抬到 ≈#F1E4D3，
       贴近 AI 版实测的 #F4E5D2。这是**打光**不是换颜料——色相不动、只抬明度，
       所以仍在品牌色范围内（2026-08-17 老板「比 AI 版暗一档」反馈的处置）。*/
    --paper-lift: 40%;
    --accent: #A34B3A;   /* 赭红 = 唯一强调色 */
    --ink:    #2B3A4A;   /* 墨蓝 */
    --muted:  #5A6B7B;   /* 正文灰蓝 */
    --sage:   #C9D6CE;   /* 鼠尾草绿 */
    --haze:   #A8B5C4;   /* 雾霾蓝灰 */

    /* —— 自适应引擎写回的排印量（初值只是占位）—— */
    --hero-fs: 70px;
    --hero-lh: 1.14;
    --sub-fs:  24px;
    --sub-lh:  1.42;
    --step-fs: 30px;
    --step-lh: 1.62;
    --name-fs: 44px;
    --role-fs: 24px;
    --foot-fs: 22px;

    --avatar-d: 315px;   /* 画面宽 36%（2026-08-14 老板明令「头像放大成主要元素」）*/
    --orn-w:    140px;   /* 画面宽 16%，硬上限 20% */
    --gap-min:  22px;
  }

  html, body { width: var(--w); height: var(--h); }
  /* 打光后的实际纸色。圆点/marker 要盖住虚线，必须用它而不是 --bg（用 --bg 会露出一块暗斑）*/
  :root { --paper: color-mix(in srgb, var(--bg) calc(100% - var(--paper-lift)), #FFF6E9); }
  body {
    font-family: "Noto Sans SC","Noto Sans CJK SC","Source Han Sans SC",
                 "PingFang SC","Microsoft YaHei","WenQuanYi Micro Hei",sans-serif;
    background: var(--paper);
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
  }

  /* ── 画布 + 纸纹 ─────────────────────────────────────────── */
  .canvas {
    position: relative;
    width: var(--w); height: var(--h);
    overflow: hidden;
    background: var(--paper);
  }
  /* ── 账号贴图位（咪问猫等；`D.sticker` 没给就整个元素不存在）─────────
     🔴 **不给贴图时输出与改动前 byte 级一致**：这条 CSS 规则在、但**没有元素**
        ⇒ 不参与绘制。⚠️ 验收实测的是 **PNG 字节**，⛔ 不是 HTML 文本。
     🔴 **"不挡内容"靠位置分离，⛔ 不靠层次**（视频线 2026-08-19 同一条）：
        默认贴在**右上角**——`.bottom` 那一行有 avatar(315px 主元素)+ident 占着，
        `.hero/.steps` 在中部；右上是这套版式里唯一常空的角。
     ⚠️ `z-index` 只保证它不被纸纹柔光盖住，⛔ 不拿它当"不挡字"的依据。 */
  .sticker {
    position: absolute; z-index: 3; pointer-events: none;
    width: var(--sticker-d, 200px); height: var(--sticker-d, 200px);
    background-size: contain; background-repeat: no-repeat; background-position: center;
  }
  .sticker.tr { top: var(--sticker-pad, 56px); right: var(--sticker-pad, 56px); }
  .sticker.tl { top: var(--sticker-pad, 56px); left:  var(--sticker-pad, 56px); }
  .sticker.br { bottom: var(--sticker-pad, 56px); right: var(--sticker-pad, 56px); }
  .sticker.bl { bottom: var(--sticker-pad, 56px); left:  var(--sticker-pad, 56px); }

  /* 柔光：中上偏亮、四角略沉，模拟纸面受光 */
  .canvas::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(120% 78% at 50% 22%, rgba(255,252,246,.55) 0%, rgba(255,252,246,0) 62%),
      radial-gradient(140% 100% at 50% 100%, rgba(120,96,70,.055) 0%, rgba(120,96,70,0) 55%);
  }
  /* 颗粒：feTurbulence 噪点，低透明度叠乘 —— 纸质肌理靠它，不靠贴图 */
  .canvas::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    opacity: .085; mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'>\
<filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitch'/>\
<feColorMatrix type='saturate' values='0'/></filter>\
<rect width='220' height='220' filter='url(%23n)'/></svg>");
    background-size: 220px 220px;
  }

  .stage {
    position: absolute; inset: 0; z-index: 2;
    padding: var(--pad-top) var(--pad-x) var(--pad-bottom);
    display: flex; flex-direction: column;
  }
  .sp { flex: 1 1 var(--gap-min); min-height: var(--gap-min); }
  .sp-hero  { flex-grow: 1; }
  .sp-steps { flex-grow: 1; }
  .sp-foot  { flex-grow: .45; }

  /* 正文列宽上限。**竖版不设 --content-max，回落 none＝与从前分毫不差**；
     横版（w > h）才由脚本设成画布宽的 78%——1920 宽的画布上一行拉满 1800px
     行长过长，金句会一路贴到右边缘。⛔ 这不是"顺手优化竖版"，竖版一个像素都不动。 */
  .hero, .subtitle, .steps, .bottom { max-width: var(--content-max, none); }

  /* ── ① 通栏大字压顶 ───────────────────────────────────────── */
  .hero { flex: 0 0 auto; }
  .hero .l {
    display: block;
    /* ⚠️ width 必须是 max-content：block 元素默认撑满父宽，
       getBoundingClientRect() 会返回版心宽而不是这行字的实际宽，
       自适应就会解出一个大到溢出画布的字号（2026-08-17 首次渲染实测踩到）。*/
    width: max-content;
    white-space: nowrap;
    font-size: var(--hero-fs);
    line-height: var(--hero-lh);
    font-weight: 900;
    color: var(--accent);
    letter-spacing: 0;
    /* Noto Sans CJK 只到 Bold，用极细同色描边补出 Heavy 的观感 */
    -webkit-text-stroke: .021em var(--accent);
    paint-order: stroke fill;
  }
  /* 行首/行尾的直角引号把版心啃出一块空 —— 悬挂出去，大字才真"通栏" */
  .hero .l.hang-l { margin-left: -.145em; }
  .hero .l.hang-r { margin-right: -.145em; }

  /* ── ② 副题（可空；空了整个元素不出现，字阶自动退化回三级）───── */
  .subtitle {
    flex: 0 0 auto;
    margin-top: calc(var(--sub-fs) * .62);
    font-size: var(--sub-fs);
    line-height: var(--sub-lh);
    font-weight: 800;            /* 加粗 —— 与 steps 的常规字重拉开一级 */
    color: var(--ink);           /* 墨蓝 —— 与 hero 的赭红、steps 的灰蓝各占一色 */
    letter-spacing: .01em;
    text-wrap: balance;
  }
  .subtitle .seg { white-space: nowrap; }              /* 折行只落在标点处 */
  .subtitle.free-wrap .seg { white-space: normal; }    /* 单段过宽时的退路 */

  /* ── ③ 递进三行 ───────────────────────────────────────────── */
  .steps { flex: 0 0 auto; position: relative; padding-left: var(--step-indent); }
  .rail-line {          /* 前两个圆点之间的鼠尾草绿虚线（被圆点自身背景遮断）*/
    position: absolute; left: calc(var(--step-indent) + var(--dot) / 2 - 1.5px);
    top: calc(var(--step-fs) * var(--step-lh) / 2);
    bottom: calc(var(--step-fs) * var(--step-lh) / 2);
    width: 3px;
    background-image: linear-gradient(var(--sage) 56%, transparent 56%);
    background-size: 3px 17px;
  }
  .step {
    position: relative;
    display: flex; align-items: flex-start;
    gap: calc(var(--step-fs) * .74);
    font-size: var(--step-fs);
    line-height: var(--step-lh);
    color: var(--muted);
  }
  .step + .step { margin-top: calc(var(--step-fs) * 1.05); }
  .step .mk {
    flex: 0 0 var(--dot); width: var(--dot); height: var(--dot);
    /* marker 永远对齐所在条目的**首行**中线（条目折行也不跑位）*/
    margin-top: calc((var(--step-fs) * var(--step-lh) - var(--dot)) / 2);
    display: flex; align-items: center; justify-content: center;
    background: var(--paper);        /* 盖住穿过来的虚线 */
    border-radius: 50%;
    z-index: 1;
  }
  .step .mk i {
    display: block;
    width: calc(var(--dot) * .62); height: calc(var(--dot) * .62);
    border-radius: 50%; background: var(--sage);
  }
  .step .mk svg { width: 100%; height: 100%; display: block; }
  .step.concl { color: var(--accent); font-weight: 700; }
  /* 长条目折行时把各行拉均匀，⛔ 别让第二行只剩三两个字的尾巴（Chromium 117+）*/
  .step .tx { flex: 1 1 auto; text-wrap: balance; }

  /* ── ④ 头像 + 身份 ────────────────────────────────────────── */
  .bottom { flex: 0 0 auto; display: flex; align-items: center; }
  .avatar {
    flex: 0 0 var(--avatar-d);
    width: var(--avatar-d); height: var(--avatar-d);
    border-radius: 50%;
    border: 4px solid var(--sage);
    object-fit: cover;
    background: var(--sage);
  }
  .ident { margin-left: calc(var(--avatar-d) * .12); min-width: 0; }
  .ident .name {
    font-size: var(--name-fs); font-weight: 800; color: var(--ink);
    line-height: 1.2; letter-spacing: .04em; white-space: nowrap;
  }
  .ident .role {
    margin-top: calc(var(--role-fs) * .42);
    font-size: var(--role-fs); font-weight: 400; color: var(--muted);
    line-height: 1.35; white-space: nowrap;
  }
  .ident .role .seg { white-space: nowrap; }   /* 折行只许发生在分隔号处 */
  /* 单项内也允许断行 —— ⛔ 只在「光按分隔号断放不下」时由 JS 挂上，⛔ 不常开。
     常开会让浏览器**贪心填满每一行**，把下一项的头一个字拽到上一行
     （「CPS 注册号 X-26-242 · 北 / 京大学…」），而那条数据按项断本来正好两行。
     ⚠️ `white-space: normal` **一条不够**：20 位注册号是一整个拉丁/数字"词"，
     中文能字字断开、数字串没有任何断点——不加 `overflow-wrap` 它照样横向溢出。*/
  .ident .role.seg-wrap .seg { white-space: normal; overflow-wrap: anywhere; }
  /* 🔴 **编号 token 不得从中间折断**（老板 T211=C 追加）：注册号是一个整体，
     劈成两行同时损害**可核验性**（读者没法逐位比对）与观感
     （2026-09-03 实测：20 位号折 3 行，末行只剩「02」）。
     ⚠️ 这条必须**压过**上面那条项内断行——`.seg-wrap` 的 `overflow-wrap: anywhere`
     正是会从数字中间下刀的那一手，选择器更具体才盖得住。*/
  .ident .role .num { white-space: nowrap; overflow-wrap: normal; }
  /* 最后退路：字号已到下限仍放不下时，由 JS 挂 `.num-break` 才允许折，
     **并由 `role_num_broken` 报红** —— ⛔ 静默折断。*/
  .ident .role.num-break .num { white-space: normal; overflow-wrap: anywhere; }

  /* ── ⑤ 右下陪衬 ───────────────────────────────────────────── */
  .orn {
    position: absolute; z-index: 2;
    right: var(--pad-x);
    bottom: calc(var(--pad-bottom) + var(--foot-fs) * 2.1);
    width: var(--orn-w);
  }
  .orn svg { width: 100%; height: auto; display: block; }

  /* ── ⑥ 落款 ───────────────────────────────────────────────── */
  .foot {
    flex: 0 0 auto; text-align: center;
    font-size: var(--foot-fs); font-weight: 400;
    color: var(--haze); letter-spacing: .10em;
  }

  .boom { padding: 60px; font-size: 28px; color: #A34B3A; line-height: 1.7; }
</style>
</head>
<body>
<div class="canvas" id="canvas"></div>

<script>
/* ═══════════════════════════════════════════════════════════════════
   陪衬 SVG 小库（数据里按名字点，⛔ 不与头像争视觉：宽度受 --orn-w 夹住）
   线条一律走调色板内的鼠尾草绿 / 雾霾蓝灰 / 一点点赭红。
   ═══════════════════════════════════════════════════════════════════ */
const ORN = {
  /* 一株细长的植物 + 一根扶它的支架（「扶持」意象，科普篇默认） */
  /* ⚠️ 三条硬约束，缺一条就会被读成梯子（2026-08-17 连栽三版后立下）：
     ① 茎**斜靠**在支架上（下端离支架远、上端并拢），⛔ 不许与支架平行；
     ② 两处绑扎**不等宽也不同角度**——第三版就是栽在「两对水平等长短线 = 四根横档」；
     ③ 叶片左右**不对称**（这版左三右二、大小各异），对称排列会重新长出横档节奏。
     自检办法：把图缩到 140px 宽再看一眼——还像梯子就重画，别自我说服。*/
  'plant-support': `<svg viewBox="0 0 100 224" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M75 24 68 206" stroke="#A8B5C4" stroke-width="3.8" stroke-linecap="round"/>
    <path d="M14 208h72" stroke="#C9D6CE" stroke-width="4" stroke-linecap="round"/>
    <path d="M20 206C26 168 40 132 58 104 66 90 71 60 70 34" stroke="#C9D6CE" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M30 160 18 156M38 141l13 4M48 121 33 114M66 84l14-3M70 40l-6-9" stroke="#C9D6CE" stroke-width="2.1" stroke-linecap="round"/>
    <ellipse cx="16" cy="154" rx="13.5" ry="6.2" fill="#C9D6CE" transform="rotate(-24 16 154)"/>
    <ellipse cx="54" cy="147" rx="9.5" ry="4.6" fill="#C9D6CE" transform="rotate(26 54 147)"/>
    <ellipse cx="30" cy="111" rx="15" ry="6.6" fill="#C9D6CE" transform="rotate(-19 30 111)"/>
    <ellipse cx="83" cy="79" rx="11.5" ry="5.2" fill="#C9D6CE" transform="rotate(15 83 79)"/>
    <ellipse cx="62" cy="25" rx="8.5" ry="4.4" fill="#C9D6CE" transform="rotate(-56 62 25)"/>
    <path d="M46 133 71 126" stroke="#A8B5C4" stroke-width="2.6" stroke-linecap="round"/>
    <ellipse cx="58" cy="129.5" rx="4.6" ry="3.4" fill="#A8B5C4" transform="rotate(-16 58 129.5)"/>
    <path d="M63 68 74 73" stroke="#A8B5C4" stroke-width="2.6" stroke-linecap="round"/>
    <ellipse cx="68.5" cy="70.5" rx="3.1" ry="2.4" fill="#A8B5C4" transform="rotate(24 68.5 70.5)"/>
  </svg>`,
  /* 破土的幼苗 */
  'sprout': `<svg viewBox="0 0 110 200" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M55 188V96" stroke="#8FA79A" stroke-width="4.4" stroke-linecap="round"/>
    <path d="M55 112C36 110 22 96 21 76c20-2 33 12 34 36" fill="#C9D6CE"/>
    <path d="M57 96c18-4 30-18 30-38-19 0-31 14-30 38" fill="#C9D6CE"/>
    <path d="M24 190h62" stroke="#A8B5C4" stroke-width="4.4" stroke-linecap="round"/>
    <path d="M40 168q15-10 30 0" stroke="#A34B3A" stroke-width="3" stroke-linecap="round"/>
  </svg>`,
  /* 一只冒热气的杯子（「先歇一会」意象） */
  'cup': `<svg viewBox="0 0 130 170" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M24 72h72v44c0 20-16 34-36 34S24 136 24 116z" stroke="#8FA79A" stroke-width="4.4" stroke-linejoin="round"/>
    <path d="M96 84h12c9 0 16 7 16 16s-7 16-16 16h-12" stroke="#A8B5C4" stroke-width="4.4" stroke-linecap="round"/>
    <path d="M16 162h88" stroke="#C9D6CE" stroke-width="4.4" stroke-linecap="round"/>
    <path d="M44 50c8-8 8-16 0-24M64 46c8-9 8-18 0-27M84 50c7-8 7-16 0-24" stroke="#A34B3A" stroke-width="3.2" stroke-linecap="round" opacity=".75"/>
  </svg>`,
  /* 叠石（「稳住」意象） */
  'stone': `<svg viewBox="0 0 130 180" fill="none" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="65" cy="150" rx="52" ry="18" fill="#C9D6CE"/>
    <ellipse cx="63" cy="114" rx="38" ry="16" fill="#A8B5C4" opacity=".85"/>
    <ellipse cx="67" cy="82" rx="27" ry="13" fill="#C9D6CE"/>
    <ellipse cx="64" cy="56" rx="17" ry="10" fill="#A8B5C4" opacity=".85"/>
    <path d="M64 34c0-10 6-16 14-20" stroke="#A34B3A" stroke-width="3.2" stroke-linecap="round"/>
  </svg>`,
  'none': ''
};

const ARROW = `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M3.5 12h14" stroke="#A34B3A" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M13.2 6.6 19.8 12l-6.6 5.4z" fill="#A34B3A"/></svg>`;

const OPEN_Q  = ['「','『','“','(','（','《','〈','【','［'];
const CLOSE_Q = ['」','』','”','.','。','!','！','?','？',')','）','》','〉','】','］','，',',','、'];

/* ═══════════════════════════════════════════════════════════════════
   建 DOM
   ═══════════════════════════════════════════════════════════════════ */
let D, ERR = null, ORN_UNKNOWN = null;
try {
  D = JSON.parse(document.getElementById('cover-data').textContent);
} catch (e) {
  ERR = e.message;
}

const cv = document.getElementById('canvas');

if (ERR) {
  cv.innerHTML = `<div class="boom">封面数据没注入或不是合法 JSON：<br>${ERR}<br><br>
    这个模板不含任何文案，必须由 render_cover.py --data cover.json 实例化。</div>`;
} else {
  const T = D.theme || {};
  const rs = document.documentElement.style;
  const setv = (k, v) => { if (v !== undefined && v !== null && v !== '') rs.setProperty(k, v); };
  setv('--w',  (D.canvas?.w || 876) + 'px');
  setv('--h',  (D.canvas?.h || 1313) + 'px');
  setv('--bg', T.bg); setv('--accent', T.accent); setv('--ink', T.ink);
  setv('--muted', T.muted); setv('--sage', T.sage); setv('--haze', T.haze);
  setv('--pad-x', T.pad_x); setv('--pad-top', T.pad_top); setv('--pad-bottom', T.pad_bottom);

  /* ── 横版（w > h）的版面重定 ───────────────────────────────────────
     这套四层版式（hero/递进/头像/落款）是**为竖版定义**的：左右留白 60px 在 876 宽上
     占 6.8%，搬到 1920 宽上就只剩 3.1%，字几乎贴边。横版把它按比例还原回 6.5%，
     并给正文列一个宽度上限。⛔ 只在横版生效；theme 里显式给了 pad_x 就以 theme 为准。 */
  {
    const cw = D.canvas?.w || 876, ch = D.canvas?.h || 1313;
    if (cw > ch) {
      if (T.pad_x === undefined) setv('--pad-x', Math.round(cw * 0.065) + 'px');
      setv('--content-max', Math.round(cw * (+T.content_max_ratio || 0.78)) + 'px');
    }
  }

  const heroLines = (D.hero || []).filter(s => String(s).trim() !== '');
  const subtitle  = String(D.subtitle ?? '').trim();
  const steps     = (D.steps || []).filter(s => String(s).trim() !== '');
  const idn       = D.identity || {};
  const ornName   = D.ornament || 'none';
  const ornSvg    = D.ornament_svg_inline || ORN[ornName] || '';
  /* 名字打错（`plant_support` 写成下划线之类）以前是**静默无图**——一张封面右下角
     凭空少块东西，量具全绿、没人发现。现在记下来，交给 __fit() 报红。*/
  ORN_UNKNOWN = (!D.ornament_svg_inline && !(ornName in ORN)) ? ornName : null;

  const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

  const heroHTML = heroLines.map(s => {
    const t = String(s);
    const cls = ['l'];
    if (OPEN_Q.includes(t[0])) cls.push('hang-l');
    if (CLOSE_Q.includes(t[t.length - 1])) cls.push('hang-r');
    return `<span class="${cls.join(' ')}">${esc(t)}</span>`;
  }).join('');

  /* 身份行窄到要折行时，中文可以在任意字之间断——「北大临床/心理硕士」这种断法很难看。
     把分隔号两侧各包一个 nowrap 段，折行就只会发生在分隔号处。*/
  /* 编号 token ＝ 连续 ≥4 个的字母/数字/连字符（`X-26-242`、`ZX-26-088`、
     `30220220732039900002`）。包成 `.num` 让它整体不可断，见 CSS ④ 那条。
     ⚠️ 在 `esc()` **之后**替换：编号里不含 `&<>`，转义结果不会被这条正则误伤。*/
  const NUM_TOKEN = /([A-Za-z0-9][A-Za-z0-9-]{3,})/g;
  /* ⚠️ 分隔号「·」**附在前一段末尾**，⛔ 作为段间独立文本节点。
     🩸 它自己是可断点：段间放它 ⇒ 折行时会把「·」**单独留成一行**
     （2026-09-03 黄安麟加第二项时实测：第一行编号、**第二行只有一个「·」**、第三行澳门项）。
     附在前段末尾后它跟着前段走，断点仍在同一位置、行数不变。*/
  const roleHTML = s => String(s).split(/\s*[·・|｜/]\s*/).filter(Boolean)
    .map(seg => `<span class="seg">${esc(seg).replace(NUM_TOKEN, '<span class="num">$1</span>')}</span>`)
    .join(' · ');
  /* ⚠️ **分隔号「·」是段间独立文本节点、它自己是可断点** ⇒ 折行时可能被**单独留成一行**
     （2026-09-03 黄安麟加第二项实测：第一行编号 / **第二行只有一个「·」** / 第三行澳门项）。
     🔴 **已知问题，三种写法都有代价，等裁定后再改，⛔ 顺手动**：
       ① 保持现状        —— 「·」可能孤行；**现存在产封面零影响**
       ② 分隔号并进前一个 `.seg`（正解）—— 孤行消失；但**实测改动现存 10 份里 6 份的像素**
       ③ 分隔号前放 U+00A0 —— 现存封面零影响，**但更差**：它让「X-25-046 ·」成为不可断单元，
          反而把「CPS 注册号」和它的号拆到两行（读者要跨行拼）。
     ⇒ ② 是对的修法，但它碰在产品牌封面 ⇒ 属超范围，需裁定。*/

  /* 副题（＝金句本体）按标点切成 nowrap 段，折行只发生在标点处。
     中文可以在任意两字之间断，`text-wrap: balance` 只顾把两行拉等长、不管语义，
     实测断出「一句／话没说」「夸／自己」「不是／你想太多」这种读起来卡壳的行
     （2026-08-17 四篇实测三篇中招）。标点收在前一段末尾，行尾才落得住。
     ⚠️ 单段宽过版心时这会横向溢出——__fit() 量到就摘掉 nowrap 退回自由折行。*/
  const subHTML = s => String(s).split(/(?<=[，。、！？；：,.!?;:])/).filter(Boolean)
    .map(seg => `<span class="seg">${esc(seg)}</span>`).join('');

  const stepsHTML = steps.map((s, i) => {
    const last = i === steps.length - 1;
    const mk = last ? ARROW : '<i></i>';
    return `<div class="step${last ? ' concl' : ''}"><span class="mk">${mk}</span><span class="tx">${esc(s)}</span></div>`;
  }).join('');

  cv.innerHTML = `
    ${D.sticker ? `<div class="sticker ${D.sticker_pos || 'tr'}" id="sticker"
         style="background-image:url('${D.sticker}')${D.sticker_size ? `;--sticker-d:${D.sticker_size}px` : ''}"></div>` : ''}
    <div class="stage" id="stage">
      <div class="hero" id="hero">${heroHTML}</div>
      ${subtitle ? `<div class="subtitle" id="sub">${subHTML(subtitle)}</div>` : ''}
      <div class="sp sp-hero"></div>
      <div class="steps" id="stepsBox">${steps.length > 1 ? '<div class="rail-line"></div>' : ''}${stepsHTML}</div>
      <div class="sp sp-steps"></div>
      <div class="bottom" id="bottom">
        ${D.avatar ? `<img class="avatar" id="avatar" src="${D.avatar}" alt="">` : ''}
        <div class="ident">
          ${idn.name ? `<div class="name" id="nm">${esc(idn.name)}</div>` : ''}
          ${idn.line ? `<div class="role" id="rl">${roleHTML(idn.line)}</div>` : ''}
        </div>
      </div>
      <div class="sp sp-foot"></div>
      <div class="foot" id="foot">${esc(D.footer || '')}</div>
    </div>
    ${ornSvg ? `<div class="orn" id="orn">${ornSvg}</div>` : ''}`;
}

/* ═══════════════════════════════════════════════════════════════════
   自适应引擎
   —— 三步：hero 一次线性求解 → 递进行二分 → 仍溢出才回头压 hero。
      剩余空白交给 flex spacer 自动均分，所以"不留大片空白"不用算。
   ═══════════════════════════════════════════════════════════════════ */
window.__fit = function () {
  if (ERR) return { ok: false, error: ERR };

  const T   = (D.theme || {});
  const W   = D.canvas?.w || 876;
  const H   = D.canvas?.h || 1313;
  const cs  = getComputedStyle(document.documentElement);
  const padX = parseFloat(cs.getPropertyValue('--pad-x'));
  const availW = W - padX * 2;
  const rs = document.documentElement.style;

  /* hero 这串字的**墨迹/字号比**——⛔ 实测，不用经验常数（2026-08-17 根因修复）。

     🔴 病根：这里原来写死 `H * 0.13 / 0.86`，那个 0.86 是「字高＝字号×0.86」的假设，
     而 canvas TextMetrics 量到的真实墨迹比是 **0.955～0.982**（中文 900 字重；`ABC123`
     这种纯拉丁只有 0.767，差得更远）。后果是**引擎自己的上限就比 §2-b 的 13% 高 11%**：
     字号一旦被 HERO_MAX 夹住，字高恒 14.2～14.7%，13% 这条上限在夹取生效时**永远不可达**。
     ⚠️ 这⛔ 不是横版专属——竖版 ≤4 字同样撞在这个夹取上（实测 4 字 13.79%）。
     ⛔ 「夹住时就别报了」不是修复，那是把闸门调成假绿；正解是**让上限真的等于 13%**。

     为什么测而不是换一个更准的常数：常数一旦写死，就又变成一个「被搬出标定条件」的数——
     换字重、换字族、hero 里混进拉丁或标点，比值就变了（实测同一批画布：纯中文 0.955、
     带引号 0.969、纯拉丁 **0.767**）。这里按 hero **自己那串字**解，「字高＝画面高 13%」
     这句规格才对任何字形都字面成立。

     ⛔ **不用「量一个比值再除」的写法**：`actualBoundingBox*` 是像素量化的，比值**不是**
     尺度不变的——在 400px 探针上量出的比值套到 147px 上，实测偏差最大 1.6%，换算成字高就是
     +0.19 个百分点，闸门照样翻红（2026-08-17 第一版这么写，580 样本里 21 个假红）。
     ⛔ 也不用「加个容差把它盖过去」：那是拿容差补测量方法的错。
     ✅ 正解是**直接在要用的那个字号上二分**：找最大的 fs 使得**实测**墨迹 ≤ 0.13×H。
     由构造保证 `inkAt(HERO_MAX) ≤ 0.13H`，所以夹取处字高**恒 ≤13.00%**，不需要任何容差。 */
  // ⚠️ 用 document 查而不是 hero.querySelectorAll：`hero` 这个 const 在下面才定义
  const heroLineEls = [...document.querySelectorAll('.hero .l')];
  const inkAt = (() => {
    const ctx = document.createElement('canvas').getContext('2d');
    const fam = getComputedStyle(document.body).fontFamily;
    return fs => {
      ctx.font = `900 ${fs}px ${fam}`;
      let mx = 0;
      heroLineEls.forEach(el => {
        const m = ctx.measureText(el.textContent);
        mx = Math.max(mx, (m.actualBoundingBoxAscent || 0) + (m.actualBoundingBoxDescent || 0));
      });
      return mx;
    };
  })();
  const solveHeroMax = () => {
    const target = H * 0.13;
    if (!heroLineEls.length) return Math.round(target / 0.96);   // hero 为空的兜底
    /* 上界按最扁的字形（拉丁 0.75）留足；⛔ 别按中文 0.96 算，拉丁 hero 会被误夹。 */
    let lo = 8, hi = Math.ceil(target / 0.5);
    if (inkAt(hi) <= target) return hi;
    while (hi - lo > 1) {
      const mid = (lo + hi) >> 1;
      if (inkAt(mid) <= target) lo = mid; else hi = mid;
    }
    return lo;   // 只在实测通过时才前移 lo ⇒ inkAt(lo) ≤ target 由构造成立
  };
  const heroInkRatio = heroLineEls.length ? inkAt(100) / 100 : 0;   // 只用于交回量具，⛔ 不参与求解

  /* 档位闸门（可被 theme 覆盖；默认值＝老板已验收那张封面的实测比例） */
  // 字高＝画面高 13% → font-size 上限。⛔ 二分实测解出来的，见上；⛔ 别退回 `0.13/常数`
  const HERO_MAX   = +(T.hero_max   ?? solveHeroMax());
  const HERO_MIN   = +(T.hero_min   ?? 56);   // 缩略图 220px 下 ≈14px，可读下限
  const STEP_MAX   = +(T.step_max   ?? 42);
  const STEP_FLOOR = +(T.step_floor ?? 22);
  /* 🔴 身份行字号下限 **20**（老板 T211=C 处置口径，2026-09-03 助理定档）。
     ⚠️ 旧值 18 太松：18px 在 220px 缩略图上只有 4.5px，那条闸门等于没有。
     🩸 **为什么是 20 而不是 21**（同日订正）：最长那位实测解到 **21.4px**，
     取 21 只剩 **0.4px（1.9%）** 余量 —— 判据线与实测值贴这么近，
     **它会把无关改动随机打红，而恒随机的闸门等于没闸门**。取 20 留出 1.4px（7%）。
     ⚠️ 改动前先看量具交回的 `role_fs_margin`：⛔ 别再往这条线上加约束而不量余量。*/
  const ROLE_MIN   = +(T.role_min   ?? 20);
  /* 🔴 身份行允许折到 **3 行**（老板 T211=C 2026-09-03 的处置口径）。
     🩸 为什么必须放开：`counselor-note-spec` §4 的「**恒为一行**」「**⛔ 缩小字号硬塞**」
     「**⛔ 删项**」三条对长内容**不可能同时成立**，而引擎此前牺牲的是**字号**——
     2026-09-03 实测：11 位身份行被解到 12.4–23.8px，最差 10px 级。
     老板要的「小字」是 detail 档那个小（hero × 0.22 ≈ 34.8px），⛔ 不是 10px 那个小。
     ⇒ 换行是唯一同时满足「不缩字号、不删项、不动 hero/副题/头像」的读法。
     ⛔ 别顺手把它做成可配置：三档字号与三行上限都是版式定值，不是调用方的旋钮。*/
  const ROLE_MAX_LINES = 3;
  const NAME_MIN   = +(T.name_min   ?? 26);
  /* 递进行 = hero × 0.58 ≈ 老板已验收那张封面的实测比例（hero 70 / 递进行 40）。 */
  const heroCoef   = +(T.step_coef  ?? 0.58);
  /* 副题 = hero × 0.34 —— illustration-spec §2-b 给 support/副题 定的系数。
     ⚠️ 首版没有副题层、把 0.34 误套给递进行导致弃用；这一版它回到正主身上，
     递进行仍走 0.58，两个系数各归各位（2026-08-17 方案 1）。*/
  const subCoef    = +(T.sub_coef   ?? 0.34);
  const GAP_ORN    = 24;   // 身份行与右下陪衬之间必须留的呼吸

  const stage = document.getElementById('stage');
  const hero  = document.getElementById('hero');
  const sub   = document.getElementById('sub');
  const stepsBox = document.getElementById('stepsBox');
  const orn   = document.getElementById('orn');

  const rectOf = el => el.getBoundingClientRect();
  /* 文字块的**实际**外接框：.name/.role 是 block，rect.width 恒等于容器宽，
     拿它判重叠永远判不出来（首版 P0 的一半病根）。Range 量的是字本身。*/
  const inkRect = el => { const r = document.createRange(); r.selectNodeContents(el); return r.getBoundingClientRect(); };
  const hit = (a, b) => a.left < b.right - .5 && a.right > b.left + .5 && a.top < b.bottom - .5 && a.bottom > b.top + .5;
  /* 该元素这一行能用到多右：陪衬在它**同一高度**上时让到陪衬左边，否则吃满版心。 */
  const rightLimit = r => {
    if (!orn) return W - padX;
    const o = rectOf(orn);
    const vOverlap = r.top < o.bottom && r.bottom > o.top;
    return vOverlap ? Math.min(W - padX, o.left - GAP_ORN) : (W - padX);
  };
  /* 单行不折的文字：同字体下行宽与字号严格线性，量一次即可解出。
     ⛔ 只夹上限、不把字号抬回下限——抬回去就横向溢出、被陪衬盖掉半句，
     而所有量具照样报绿（2026-08-17 压力测试实证）。低于下限是**报红**的事，不是夹回去的事。*/
  const linearFit = (el, ideal, avail) => {
    const PROBE = 40, keep = el.style.fontSize;
    el.style.fontSize = PROBE + 'px';
    const ratio = el.scrollWidth / PROBE;
    el.style.fontSize = keep;
    return ratio > 0 ? Math.min(ideal, (avail * 0.99) / ratio) : ideal;
  };

  /* —— 步骤 1：hero「恰好撑满版心」——
     同字体下行宽与字号严格线性，探针量一次即可解出，⛔ 不必二分。 */
  const lines = [...hero.querySelectorAll('.l')];
  let heroFs = HERO_MAX;
  if (lines.length) {
    const PROBE = 100;
    let ratio = 0;                                   // 每 1px 字号对应的最长行宽
    lines.forEach(el => { el.style.fontSize = PROBE + 'px'; });
    lines.forEach(el => { ratio = Math.max(ratio, el.getBoundingClientRect().width / PROBE); });
    heroFs = Math.min(HERO_MAX, (availW * 0.997) / ratio);   // 0.3% 余量留给描边外扩
    /* ⛔ 这里绝不能 Math.max(HERO_MIN, …)：把字号抬回下限，字就横向溢出画布、
       右边被裁掉半句，而所有量具照样报绿（2026-08-17 压力测试实证）。
       正确处置是**照解出的字号渲染**（不溢出），再把"低于可读下限"这条红报出去。*/
  }
  const heroBelowMin = heroFs < HERO_MIN - 0.01;
  const applyHero = fs => {
    rs.setProperty('--hero-fs', fs.toFixed(2) + 'px');
    lines.forEach(el => { el.style.fontSize = ''; });
  };
  applyHero(heroFs);

  /* —— 步骤 1.5：副题 = hero × 0.34 ——
     副题允许折行（长句本来就是从 hero 降下来的），高度进 flex 预算、由步骤 2 兜。*/
  let subFs = 0, subSegOverflow = false;
  if (sub) {
    subFs = heroFs * subCoef;
    rs.setProperty('--sub-fs', subFs.toFixed(2) + 'px');
    /* 标点分段是 nowrap 的：某一段本身就比版心宽时，它会直接横向溢出画布
       （又一个"渲得出来但错了"的形态）。量到就摘掉 nowrap 退回自由折行——
       断行位置难看，总好过半句话被切在画布外。*/
    const segs = [...sub.querySelectorAll('.seg')];
    subSegOverflow = segs.some(el => el.getBoundingClientRect().width > availW + 0.5);
    if (subSegOverflow) sub.classList.add('free-wrap');
  }

  /* 头像 / 姓名 / 落款：跟着 hero 走同一套系数 */
  const avatarD = Math.round(W * +(T.avatar_ratio ?? 0.36));
  rs.setProperty('--avatar-d', avatarD + 'px');
  rs.setProperty('--orn-w', Math.round(W * Math.min(+(T.orn_ratio ?? 0.16), 0.20)) + 'px');
  rs.setProperty('--name-fs', Math.round(Math.max(30, Math.min(58, heroFs * 0.62))) + 'px');
  rs.setProperty('--foot-fs', Math.round(Math.max(18, Math.min(28, heroFs * 0.31))) + 'px');

  /* —— 步骤 2：递进行二分求"整幅不溢出的最大字号" ——
     判定函数直接问 stage 溢没溢，把折行、行距、间隔全算进去，
     ⛔ 不自己另算一套高度预算（算两遍必然对不上）。 */
  /* ⚠️ 判据必须是「最后一个元素的底 ≤ 下边距线」，⛔ 不能用 stage.scrollHeight。
     stage 是 overflow:visible 的 flex 容器，内容溢出时 Chromium 的 scrollHeight
     **一直等于 clientHeight**（实测 1313 = 1313），于是内容一路吃掉整条 76px 下边距、
     还越过 3:4 裁切线，量具照样报 overflow_px = 0 —— 首版就是靠这个恒绿闸门混过去的
     （2026-08-17 加副题层后 70.8px 溢出仍报绿，当场揪出）。
     用几何量还有一个好处：flex 子元素的 margin（副题的 margin-top）也算得进去。*/
  const padBottom = parseFloat(cs.getPropertyValue('--pad-bottom'));
  const bottomLine = () => stage.getBoundingClientRect().bottom - padBottom;
  const contentBottom = () => {
    const last = stage.lastElementChild;
    return last ? last.getBoundingClientRect().bottom : 0;
  };
  const fits = () => contentBottom() <= bottomLine() + 0.5;
  const applyStep = fs => {
    rs.setProperty('--step-fs', fs.toFixed(2) + 'px');
    rs.setProperty('--dot', Math.round(fs * 0.72) + 'px');
  };
  /* 递进行的上限还得**让副题一档**：字阶是四级，steps 一旦追平副题，
     hero→副题→steps 三级就塌成两级（hero 小、副题短时最容易发生）。*/
  const stepCap = () => {
    let c = Math.min(STEP_MAX, heroFs * heroCoef);
    if (subFs) c = Math.min(c, subFs * 0.9);
    return Math.max(STEP_FLOOR, c);
  };
  let cap = stepCap();
  const solveStep = () => {
    applyStep(cap);
    if (fits()) return cap;
    let lo = STEP_FLOOR, hi = cap, best = null;
    for (let i = 0; i < 22 && hi - lo > 0.25; i++) {
      const mid = (lo + hi) / 2;
      applyStep(mid);
      if (fits()) { best = mid; lo = mid; } else { hi = mid; }
    }
    applyStep(best ?? STEP_FLOOR);
    return best ?? STEP_FLOOR;
  };
  let stepFs = solveStep();

  /* —— 步骤 3：踩到 STEP_FLOOR 还塞不下，才回头压 hero ——
     次序不能反：hero 是缩略图里唯一必读的东西，压它是最后手段。 */
  let heroSqueezed = false;
  while (!fits() && heroFs > HERO_MIN) {
    heroFs = Math.max(HERO_MIN, heroFs - 2);
    applyHero(heroFs);
    if (sub) { subFs = heroFs * subCoef; rs.setProperty('--sub-fs', subFs.toFixed(2) + 'px'); }
    cap = stepCap();
    stepFs = solveStep();
    heroSqueezed = true;
  }

  /* —— 身份两行：单行不折，线性缩到**各自那一行**的可用宽 ——
     ⚠️ 姓名以前完全没测量（只按 heroFs×0.62 夹在 [30,58]，与可用宽无关），
     一遇长姓名就直接压到右下陪衬上（2026-08-17 E3 实测，必然非偶发）。
     两行走同一套写法，且可用宽由陪衬的**实测位置**决定，不是拍脑袋减一个常数。*/
  const nm = document.getElementById('nm');
  const rl = document.getElementById('rl');
  let nameFs = parseFloat(cs.getPropertyValue('--name-fs')) || 44;
  let roleFs = parseFloat(cs.getPropertyValue('--role-fs')) || 24;
  const nameIdeal = Math.max(30, Math.min(58, heroFs * 0.62));
  const fitIdent = () => {
    if (nm) {
      const r = inkRect(nm);
      nameFs = linearFit(nm, nameIdeal, rightLimit(r) - r.left);
      rs.setProperty('--name-fs', nameFs.toFixed(1) + 'px');
    }
    if (rl) {
      const r = inkRect(rl);
      const avail = rightLimit(r) - r.left;
      /* 身份行是 detail 档（§2-b：hero × 0.20–0.22），并且不许追平**实际渲出来的**姓名。
         ⚠️ 两处坑都踩过：① 旧写法 heroFs × 0.34 —— hero 从 70 涨到 150 后这行解到 51px，
         比递进行还大；② 一度把目标挂在被挤小的 nameFs 上 —— 姓名一被压窄，
         身份行的目标跟着塌到下限以下，两行折行那条路直接变成空转（E3/E5 实测）。*/
      const ideal = Math.max(ROLE_MIN, Math.min(heroFs * 0.22, nameFs * 0.60));
      rl.style.whiteSpace = 'nowrap'; rl.style.maxWidth = '';
      rl.classList.remove('seg-wrap');
      roleFs = linearFit(rl, ideal, avail);
      /* 头像放大到 36% 后身份行的可用宽被挤窄，单行解常常掉到可读下限附近。
         宁可**折成两行**也不把这行缩小超过 15%（纵向空间由头像撑着，白留着也是留着），
         ⛔ 别为了「保持单行」把字缩成一条灰线。两行仍够不着下限才报红。*/
      if (roleFs < Math.max(ROLE_MIN, ideal * 0.85)) {
        rl.style.whiteSpace = 'normal';
        rl.style.maxWidth = avail.toFixed(1) + 'px';
        /* 高度**和**宽度都要判：.seg 是 nowrap，单段撑爆 max-width 时行数不变、
           只会横向溢出到陪衬上——只判高度就是又一个恒绿闸门。*/
        const roomAt = fs => rl.getBoundingClientRect().height <= fs * 1.35 * ROLE_MAX_LINES + 1
                          && rl.scrollWidth <= avail + 0.5;
        /* 项内断行**按需启用**：先只在分隔号处断试一次，装不下才放开项内断。
           ⚠️ `okAt` 因此有**副作用**（seg-wrap 挂没挂），二分结束后必须按最终字号
           **重放一次**，⛔ 别留着最后一次失败探测的状态——那会让一条本可以不拆词的
           身份行拆着词渲出去。*/
        const okAt = fs => {
          rs.setProperty('--role-fs', fs.toFixed(2) + 'px');
          rl.classList.remove('seg-wrap');
          if (roomAt(fs)) return true;
          rl.classList.add('seg-wrap');
          return roomAt(fs);
        };
        /* ⚠️ 先直接试 ideal 本身，⛔ 别一上来就二分：单行解与 ideal 只差零点几 px 时，
           二分的 hi-lo 门限直接把循环跳过，折行这条路整个空转（E3/E5 实测卡在 17.8px）。*/
        const oneLine = roleFs;   // 单行解，二分的下界
        const solveFold = () => {
          if (okAt(ideal)) return ideal;
          let lo = oneLine, hi = ideal, best = oneLine;
          for (let i = 0; i < 20 && hi - lo > 0.2; i++) {
            const mid = (lo + hi) / 2;
            if (okAt(mid)) { best = mid; lo = mid; } else hi = mid;
          }
          return best;
        };
        roleFs = solveFold();
        okAt(roleFs);   /* 按最终字号重放，把 seg-wrap 的状态与它对齐（见上面副作用那段）*/
        /* 🔴 编号不折的前提下已经掉到下限以下 ⇒ 才启用最后退路「允许折编号」。
           次序不能反：**先降字号、后折编号**（T211=C：编号完整优先于字号大小）。
           ⚠️ 折了就得**看得见** —— `role_num_broken` 会把它交出去并报红，
           ⛔ 不是悄悄折完照常报绿。*/
        if (roleFs < ROLE_MIN - 0.01) {
          rl.classList.add('num-break');
          roleFs = solveFold();
          okAt(roleFs);
        }
      }
      rs.setProperty('--role-fs', roleFs.toFixed(1) + 'px');
    }
  };
  fitIdent();
  fitIdent();   /* 缩完字号行高变了、纵向位置也变了 —— 再按新位置量一次陪衬避让 */

  /* 自检：量**实际**外接框有没有真的压上陪衬。
     「我按可用宽算过了」不算证据，重叠与否得当场量（2026-08-17 定）。*/
  let identOrnHit = false;
  if (orn) {
    const o = rectOf(orn);
    identOrnHit = [nm, rl].filter(Boolean).some(el => hit(inkRect(el), o));
  }

  /* —— 虚线：按 marker 实测中心定位 ——
     ⚠️ 不能用「容器上下各留半行」的纯 CSS 写法：条目一折行，最后一个 marker
     还在它的首行，虚线却按容器底算，会越过结论行的箭头继续往下拖一截
     （2026-08-17 第二版渲染实测踩到）。 */
  const rail = document.querySelector('.rail-line');
  if (rail) {
    const mks = [...stepsBox.querySelectorAll('.step .mk')];
    if (mks.length > 1) {
      const box = stepsBox.getBoundingClientRect();
      const mid = el => { const r = el.getBoundingClientRect(); return r.top + r.height / 2 - box.top; };
      const a = mid(mks[0]), b = mid(mks[mks.length - 1]);
      rail.style.top = a.toFixed(1) + 'px';
      rail.style.height = (b - a).toFixed(1) + 'px';
      rail.style.bottom = 'auto';
    } else {
      rail.style.display = 'none';
    }
  }

  /* ══ 横版（w > h）：把内容整组垂直居中 ═══════════════════════════════════
     ⚠️ **只在横版跑，竖版一个像素都不动**（判据 W > H，竖版直接跳过整段）。

     为什么要有这段：四层版式的第③递进层、第④头像层本来占着下半部；横版做视频封面时
     头像层不适用（render_cover.check_fields 对横版豁免了 avatar/identity），
     那两层一空，弹簧就把内容全顶到上边——实测内容中心落在画面 24.4% 处、下半 60% 全空。
     老板 2026-08-17 打回视频封面的原话是「我要的是封面，不是几个元素的凑数」，
     再交一张下半大片空白的必然二次打回。

     ⛔ 放在这里（**所有字号求解之后**）是有意的：hero 字号那套线性求解是老板验收过的，
     这段只**搬位置**、不参与求解——求解仍在原来的弹簧布局下完成，解出的字号分毫不变。 */
  const LANDSCAPE = W > H;
  const LAND_CENTER_R = +(T.land_center ?? 0.45);   /* 视觉中心略高于几何中心，符合阅读习惯 */
  let landCenterPct = null;
  let landHid4 = false;
  if (LANDSCAPE) {
    const alive = (el) => el && el.getBoundingClientRect().height > 0.5;
    /* ⓪ 第 ④ 层（头像 + 姓名/身份行）整层不出现。
       ⚠️ 这是**跟着豁免必须一起做的那一半**：check_fields 对横版豁免 avatar/identity 的
       理由是「横版下第 ④ 层压根不存在」——那就得真的不存在。只豁免闸门却照旧渲染，
       会得到一个**半拉子第 ④ 层**：头像位空着，姓名却仍按「头像右侧」缩进 37.8px，
       读起来就是一行没来由的悬空小字（实测 1920×1080：`NBDpsy`/`心理科普` 缩在左下角，
       且与底部落款「NBDpsy 心理科普」内容重复）。老板打回的原话正是
       「我要的是封面，不是几个元素的凑数」——这一层就是那个「凑数元素」。
       ⛔ 不是静默丢数据：横版下 identity 被吃掉这件事，由 render_cover.py 打进
       stdout 与凭证的 exempted / landscape_layer4_hidden 说明。 */
    const bottomEl = document.getElementById('bottom');
    if (bottomEl) { bottomEl.style.display = 'none'; landHid4 = true; }
    /* ① 落款脱离流、钉在底边——它是品牌位，⛔ 不跟着内容组一起居中 */
    const footEl = document.getElementById('foot');
    if (footEl) {
      footEl.style.position = 'absolute';
      footEl.style.left = 'var(--pad-x)';
      footEl.style.right = 'var(--pad-x)';
      footEl.style.bottom = 'var(--pad-bottom)';
    }
    /* ② 弹簧不再抢空间：只在**两侧都有东西**时留一个 gap-min，否则收成 0。
       ⛔ 不能一律留——空块两侧的弹簧会把死空间算进内容组，居中就偏了。 */
    const gapMin = parseFloat(cs.getPropertyValue('--gap-min')) || 22;
    [...stage.querySelectorAll('.sp')].forEach((sp) => {
      const keep = alive(sp.previousElementSibling) && alive(sp.nextElementSibling);
      sp.style.flex = '0 0 auto';
      sp.style.minHeight = '0';
      sp.style.height = keep ? gapMin + 'px' : '0px';
    });
    /* ③ 量**真实存在**的那几块，整组平移到视觉中心。弹簧已固定、块高已定，
       所以改 padding-top 就是 1:1 平移，⛔ 不会被弹簧吃掉一部分。 */
    const live = [hero, sub, stepsBox, document.getElementById('bottom')].filter(alive);
    if (live.length) {
      const rects = live.map((el) => el.getBoundingClientRect());
      const top = Math.min(...rects.map((r) => r.top));
      const bot = Math.max(...rects.map((r) => r.bottom));
      const padTop = parseFloat(cs.getPropertyValue('--pad-top'));
      stage.style.paddingTop = (padTop + (LAND_CENTER_R * H - (top + bot) / 2)) + 'px';
      const after = live.map((el) => el.getBoundingClientRect());
      landCenterPct = +(((Math.min(...after.map((r) => r.top)) +
                          Math.max(...after.map((r) => r.bottom))) / 2) / H * 100).toFixed(1);
    }
  }

  /* —— 3:4 裁切安全区自检（信息流按 3:4 展示，上下各切 (H - W*4/3)/2）—— */
  const cut = Math.max(0, (H - W * 4 / 3) / 2);
  const boxes = [...document.querySelectorAll('#hero,#sub,#stepsBox,#bottom,#foot,#orn')]
    .map(el => el.getBoundingClientRect());
  const outOfSafe = boxes.some(b => b.top < cut - 0.5 || b.bottom > H - cut + 0.5);

  /* —— hero 字高：量**实际墨迹**，不拿 0.86 这个经验常数糊弄 ——
     canvas TextMetrics 的 actualBoundingBox* 给的是这串字真正占的上下沿。*/
  const inkH = (() => {
    const ctx = document.createElement('canvas').getContext('2d');
    const fam = getComputedStyle(document.body).fontFamily;
    let mx = 0;
    lines.forEach(el => {
      ctx.font = `900 ${heroFs}px ${fam}`;
      const m = ctx.measureText(el.textContent);
      mx = Math.max(mx, (m.actualBoundingBoxAscent || 0) + (m.actualBoundingBoxDescent || 0));
    });
    return mx;
  })();
  const glyphPct = inkH / H * 100;

  /* ══ hero 字高的判据带 9–13%：**两个画幅同一档**（根因修好之后就不必分岔了）════
     修复前这里曾按画幅分岔（横版 15.5）。⛔ 那是在**绕开根因**：13% 之所以在横版恒被
     冲破，不是因为 13% 对横版不成立，而是因为 HERO_MAX 拿 0.86 反推、上限本身就比 13% 高
     11%（见上面 heroInkRatio 那段）。分母换成实测墨迹比之后，**夹取生效时字高恰好落在
     13% 以内**，两个画幅都一样——分岔的前提没了，分岔也就撤了。

     修复前后实测（hero 单行，1920×1080 横版 / 876×1313 竖版）：
       画幅   字数   修前字号→字高%      修后字号→字高%
       横版   2–10   163 → 14.3～14.5 ⚠️   142 → 12.4～12.7 ✅
       竖版   ≤3     198 → 14.5     ⚠️   172 → 12.6      ✅
       竖版    4     188 → 13.8     ⚠️   172 → 12.6      ✅（字号被上限接管，不再撑满通栏）
     · 上限 13%：修后**默认参数下不会触发**——⛔ 但这不是死闸门，两条可达路径都实测过：
       ① `theme.hero_max` 被显式调大；② 字体没落在 Noto Sans SC 那一族（墨迹比变了）。
       那两种才是真的「字号被设大了」，⛔ 与文案长短无关。
     · 下限 9%：两个画幅都可达、单调、且处置可行（砍字真能把字号抬回去）。
       ⚠️ 已知偏松：16:9 上 9% 换算到 220px 缩略图只有 11.6px，低于本模板自己写的
       「≈14px 可读下限」（那对应 10.9%）。⛔ 没有「横版视频封面在多宽的信息流里被看到」
       的实测就不动它——凭空把 220 这个小红书数搬过来，正是本次要治的那个病。
     · ⛔ **没有容差、也不需要**：HERO_MAX 是在真实字号上二分实测解出来的，夹取处字高
       由构造 ≤13.00%。⚠️ 上一版拿 400px 探针的比值外推，夹取处会冒到 13.19% 而不得不加容差
       ——那是拿容差补测量方法的错。⛔ 别再往这条闸门上加容差，先怀疑求解方式。 */
  const GLYPH_PCT_LOW  = 9;
  const GLYPH_PCT_HIGH = 13;

  /* hero 墨迹行宽占版心宽——**横版专属**，⛔ 竖版恒 null（竖版 ≥4 字就撑满，量它没意义）。
     为什么要多这一个量：横版下「hero 太短」的后果**根本不落在字高上**（2→10 字字高恒 14.4%），
     它落在占宽上（18%→96%）。实测 4 字只占 35%，大字比副题还窄、焦点不成立；6 字 53% 起才立得住。
     阈值 40% ＝ 4 字(35.2%) 与 5 字(44.0%) 之间，两侧各留 1.1 倍上下——窄是事实：
     相邻字数就差 8.8 个百分点，⛔ 别为「看起来安全」往任一侧挪。
     ⚠️ **这张表跟着 HERO_MAX 走**：根因修复把 16:9 的上限从 163 降到 146～148，占宽整体
     缩了约 10%，阈值也从 45 跟着降到 40。⛔ 以后再动 HERO_MAX 的解法，这里必须重标。
     ⚠️ 这也是横版下「多留两个字」唯一真正管用的地方：加字不改字号，但实打实加宽。

     🔴 **只在字号顶在 HERO_MAX 上时才判**（heroAtMax）：「加字不改字号」这句话的前提就是
     字号被 HERO_MAX 顶死。字号已经被宽度或竖向余量压下来时（小画布、带 steps 的横版：
     实测 876×493 三行递进，字号被压到远低于 HERO_MAX、占宽不足），再叫人加字只会
     **把字压得更小**——那就又成了一条「给的处置做不到」的告警，与本次要治的病同族。 */
  const HERO_FILL_MIN = 40;
  const heroInkW = lines.length ? Math.max(...lines.map(el => inkRect(el).width)) : 0;
  const heroFillPct = availW > 0 ? heroInkW / availW * 100 : 0;
  const heroAtMax = heroFs >= HERO_MAX - 0.01;

  /* —— 交回验收要看的量具 —— */
  const thumbW = +(T.thumb_w ?? 220);
  return {
    ok: true,
    /* 横版才有值：内容组的实际视觉中心占画面高的百分比（竖版为 null）。
       版面是目视判断，但「顶在上边」这件事是量得出来的——留个数好复查。 */
    landscape: LANDSCAPE,
    content_center_pct: landCenterPct,
    /* 横版是否真的把第 ④ 层收起来了。⛔ 这个数得从 DOM 出来、⛔ 不许由调用方假定：
       「豁免了闸门」与「版面上真收起来了」是两件事，只有后者是读者看得见的那件。 */
    landscape_layer4_hidden: landHid4,
    hero_fs: +heroFs.toFixed(1),
    hero_lines: lines.length,
    /* 🔴 **递进行的实际折行数**（2026-08-22 补）：`.step .tx` 是 inline 元素，
       `getClientRects().length` 就是它真正占了几行。
       🩸 **为什么必须从 DOM 出来**：递进区与 hero 的排版策略**相反**——
       hero 是**压字号避免折行**（所以 `hero_fs` 掉到多低就是它的告警），
       **递进行是允许折行的**（`.step .mk` 的注释写着"条目折行也不跑位"）。
       ⇒ 一条 46 字的递进行实测折成 **4 行**、把递进区撑到近半屏，
       而 `step_fs` 反而是 42px（比压缩时的 22px 还大）——**看数字完全正常**。
       ⚠️ 也就是说：**递进区失衡这件事，此前没有任何量具在报**。 */
    /* 🩸 **量法返工过一次**：首版写 `el.getClientRects().length`，对一条**实测折成 4 行**
       的递进行报 **1**——`.tx` 是 `flex:1 1 auto` 的 **flex item（block-level）**，
       它自己只有**一个**边框盒，行数在它**内容**里。
       ⚠️ 那个 1 看起来完全合理，**拿"已知折 4 行"的样本去验才发现是假的**。
       ⇒ 改用 `Range.selectNodeContents` —— Range 的 getClientRects **按行返回**。 */
    step_lines: [...document.querySelectorAll('.step .tx')].map(el => {
      const r = document.createRange();
      r.selectNodeContents(el);
      return r.getClientRects().length;
    }),
    /* 🔴 **决定 hero 字高的是「最长那一行」的字数，⛔ 不是总字数**
       （小红书发布线 2026-08-18，13 个真实渲染样本，完美单调）：
         最长行 5 字 → 11.12%｜6 字 → 9.22–9.37%｜7 字 → 8.00%🔴｜8 字 → 6.25–7.01%🔴
       **6→7 之间正好跨过 9% 下限。**
       ⚠️ 总字数不相干：9 字(5+4) 与 10 字(5+5) 字高相同；
          而 **10 字拆成 3+7 只有 8.00%、直接报红** ⇒ 「总字数 ≤12」那条规则会**放过它**。
       物理上也说得通：hero 宽度固定，字号 ≈ 可用宽度 ÷ 最长行字数，短的那行只是没占满。 */
    /* 🩸 **口径 2026-08-22 从「数汉字」改成「按宽度计」**（8/21 事件的真 bug）：
       原来写 `match(/[一-龥]/g).length`——**只数汉字，标点一个都不算**。
       于是「5 字 + 1 个全角逗号」被计成 **5 字（判过）**，而**全角标点占 1.0 字宽
       ＝实际就是 6 字**，字高掉到 9.67%（6 字档是 9.22–9.37%）。
       ⇒ 上面那张实证表按「最长行字数」卡，而计数漏掉了标点 ⇒ **判据自己有个洞**。
       🩸 8/21 原始事件：试排半角逗号 9.79% → 落稿改**全角** 8.33%。
          ⚠️ 一度被转述成「半角逗号使 9.79→8.33」**方向反了**——
          6 组对照实测：无标点 11.04% ／ 全角 9.67% ／ **半角 11.58%（反而更高）**。
          **压字高的是全角**（1.0 宽），半角只占 0.6、几乎不吃宽度。
       ⇒ 计宽：汉字与全角标点 1.0、ASCII/半角 0.6。⛔ 别再回到「只数汉字」。 */
    hero_max_line: Math.max(...lines.map(el => {
      let w = 0;
      for (const ch of (el.textContent || '').trim()) {
        if (/\s/.test(ch)) continue;
        w += (ch.charCodeAt(0) < 0x2E80) ? 0.6 : 1.0;   /* < 0x2E80 ≈ ASCII/拉丁/半角 */
      }
      return Math.round(w * 10) / 10;
    }), 0),
    hero_thumb_px: +(heroFs * thumbW / W).toFixed(1),
    hero_glyph_px: +inkH.toFixed(1),
    hero_glyph_pct_of_h: +(inkH / H * 100).toFixed(2),
    sub_fs: +subFs.toFixed(1),
    /* 🔴 **画面上实际画出来的副题文本**（从渲染后的 DOM 取，⛔ 不是输入的回声）。
       咨询师推介封面有一条内容硬要求「副题第一行须带『北大』二字」
       （counselor-note-spec T201 L221，助理 2026-09-03 裁定**按字面二字**执行：
       它是 GEO/品牌关键词，而「北京大学」四字里**没有相邻的「北大」**）。
       ⚠️ 判它必须判**画出来的那串字**：副题会被 `subHTML()` 按标点切段、
       可能触发 free-wrap，输入与画面之间隔着一层——判输入就是判回声。
       ⛔ 这里只**交出文本**、不在渲染器里判「有没有北大」：那是**咨询师推介封面专属**的
       内容判据，而本模板同时服务科普笔记封面，硬判会把它们全部误伤。判据留在验收守卫。*/
    sub_text: sub ? sub.textContent.replace(/\s+/g, ' ').trim() : null,
    hero_sub_ratio: subFs ? +(heroFs / subFs).toFixed(2) : null,
    step_fs: +stepFs.toFixed(1),
    /* 递进行**有几条**。⛔ 必须交出去：整份不传 steps 时求解器照样会解出一个 stepFs
       （STEP_FLOOR 兜底），于是 step_over_sub / step_at_floor 会对着一个**画面上根本不存在
       的层**报红，处置（「优先删递进行的字」）也无从执行——与本次要治的病同族
       （2026-08-17 实测：876×493 无 steps 的数据报「递进行 22px 追平副题」）。 */
    steps_count: stepsBox ? stepsBox.querySelectorAll('.step').length : 0,
    name_fs: +nameFs.toFixed(1),
    role_fs: +roleFs.toFixed(1),
    role_min: ROLE_MIN,
    role_max_lines: ROLE_MAX_LINES,
    /* 身份行**实际**拿到的可用宽。⛔ 必须交：字号是 min(档位上限, 可用宽/行宽) 解出来的，
       只报字号的话，「解小了」到底是文本太长还是可用宽被陪衬夹小，读的人分不出来。*/
    role_avail: rl ? +(function(){ const r = document.createRange(); r.selectNodeContents(rl);
      const b = r.getBoundingClientRect(); return rightLimit(b) - b.left; })().toFixed(1) : null,
    /* 缩略图上的实际字号（与 hero_thumb_px 共用同一个 thumbW，⛔ 不在 python 侧另算）。*/
    role_thumb_px: +(roleFs * thumbW / W).toFixed(1),
    /* 🔴 **实际折了几行**。两个坑都踩过，⛔ 别退回任何一种：
       ① `el.getClientRects()` —— `.role` 是 block，它自己只有一个边框盒，
          行数在它**内容**里，会恒报 1（与 step_lines 同一个坑）；
       ② `Range.selectNodeContents(...).getClientRects().length` —— 对**含子元素**的
          容器，每个 `<span class="seg">` 与它内部的文本节点**各产生一个矩形**，
          于是一条实际只折 2 行的身份行报成 **7**（2026-09-03 实测，⛔ 不是估算）。
          `.tx` 里是纯文本所以 step_lines 用它没事，身份行里有 seg ⇒ 不能照抄。
       ⇒ 数的是**有几个不同的行顶**。*/
    role_lines: rl ? (() => {
      const r = document.createRange(); r.selectNodeContents(rl);
      return new Set([...r.getClientRects()].map(x => Math.round(x.top * 2) / 2)).size;
    })() : 0,
    /* 项内断行**实际有没有被启用**：只报「≤3 行」的话，
       分不出「本来就一行」与「靠拆开注册号才压到三行」。*/
    role_seg_wrap: !!(rl && rl.classList.contains('seg-wrap')),
    /* 🔴 **编号 token 实际有没有被折断**（量的是 DOM 行矩形，⛔ 不是"我挂没挂那个类"）。
       ⚠️ 两者会分叉：`.num-break` 只是**允许**折，具体折没折要看排到哪；
       报「允许了」而不报「真折了」，就是又一条只证明动作、不证明结果的量具。*/
    role_num_broken: rl ? [...rl.querySelectorAll('.num')].some(el => {
      const r = document.createRange(); r.selectNodeContents(el);
      return new Set([...r.getClientRects()].map(x => Math.round(x.top * 2) / 2)).size > 1;
    }) : false,
    role_num_count: rl ? rl.querySelectorAll('.num').length : 0,
    /* 🔴 **距下限还剩多少**（⛔ 只报红/绿）：判据线与实测值贴得太近时，
       二值判据既几乎不可能失败、也几乎必然失败——取决于哪边先动 0.5px。
       把余量交出去，下一个改动的人才看得见自己吃掉了多少。
       🔴 **⛔ 单看这个数**：它必须与 `role_num_broken` 一起读——
       **编号一旦被折断，余量反而最好看**（折了就不再受"整体塞进一行"的约束，
       字号能解回 23.5、余量 +3.5）。2026-09-03 实测的边界：
         19 位 → 22.6（余量 2.6，完整）｜20 位 → 21.4（1.4，完整）
         21 位 → 20.4（0.4，完整）｜**22 位 → 23.5（3.5，折断 🔴）**
       ⇒ 余量从 0.4 跳回 3.5 的那一刻，正是编号被折断的那一刻。
       ⚠️ 另一个方向：**姓名 ≥7 字时余量恒 0**——那不是"掉到下限以下"，
       是 `ideal = Math.max(ROLE_MIN, …)` 把被姓名压小的天花板**托回**下限
       （7/8/9 字姓名的 nameFs×0.6 分别是 19.6/17.0/15.2，全被托到 20）。
       它稳定为 0、⛔ 不会随机翻红，但也意味着**这条线上没有任何缓冲**。*/
    role_fs_margin: rl ? +(roleFs - ROLE_MIN).toFixed(2) : null,
    /* 🔴 **画面上实际画出来的那串字**（从渲染后的 DOM 取，⛔ 不是输入的回声）。
       T211=C 的硬判据是「**编号完整不截断**」——字号够大、行数够少、
       一个字符都没少，是三件事；前两件有量具，第三件此前只能靠人盯着图数数字。
       ⚠️ 断行**不改** textContent，所以它能跨断行核对；空白已折叠。*/
    role_text: rl ? rl.textContent.replace(/\s+/g, ' ').trim() : null,
    /* 🔴 **存在型判据**（⛔ 别只留禁止型：全是"不许超"的判据在元素被删光时恒绿）：
       头像直径与它占画面宽的实际比例——防止有人为了塞下身份行把 2026-08-14
       老板明令的「头像放大成主要元素」（36%）悄悄改小。*/
    avatar_d: avatarD,
    avatar_ratio: +(avatarD / W).toFixed(4),
    avatar_present: !!document.getElementById('avatar'),
    hero_squeezed: heroSqueezed,
    hero_below_min: heroBelowMin,
    hero_min: HERO_MIN,
    hero_lines_over: lines.length > 2,
    /* §2-b：hero 字高 = 画面高 9–13%。HERO_MIN(56px) 换算只有 3.7%，
       光靠它当闸门等于没闸门——字高这条单独判（2026-08-17 方案 1 的核心验收项）。
       ⚠️ 上限恒 13、⛔ 无容差：HERO_MAX 由二分实测解出，夹取处由构造 ≤13.00%（见 solveHeroMax）。*/
    hero_glyph_pct_low: glyphPct < GLYPH_PCT_LOW,
    hero_glyph_pct_high: glyphPct > GLYPH_PCT_HIGH,
    /* 判据带、容差、以及解上限用的那个实测墨迹比，⛔ 全部交出去：
       只报「13.06% 没报警」的话，读的人无从判断这是有意放行还是闸门坏了。 */
    hero_glyph_pct_band: [GLYPH_PCT_LOW, GLYPH_PCT_HIGH],
    hero_ink_ratio: +heroInkRatio.toFixed(4),
    hero_max: HERO_MAX,
    /* hero 占版心宽：**两个画幅都量**（⛔ 不是横版专属了）。
       🔴 为什么竖版**只报不拦**：上限告警在竖版此前是个靠副作用工作的量具——它名义上管
       「字太大」，实际替我们兜住了「hero 太短」（3/4 字撞上限→报警→人去加字）。根因一修，
       副作用没了。⚠️ 但竖版**设不出一个稳的阈值**：占宽 = 字数×上限/版心宽，而竖版
       `--pad-x` 是**固定 60px、不随画布宽缩放**，于是同样 3 字在 876×1313 上占 71.0%、
       在 1080×1440 上只占 61.9%——**一个百分比在两张竖版画布之间就已经不通用**
       （横版 pad-x = 0.065W 按比例缩放，才会四档画布同值）。
       ⇒ 阈值留给下一轮按画幅推导；这一轮先把**数**交出去，⛔ 不设一个搬不动的常数。
       竖版实测（供下轮标定）：876×1313 → 2 字 47.6% / 3 字 71.0% / 4 字 94.7% / ≥5 字 99.7%；
                              1080×1440 → 2 字 41.2% / 3 字 61.9% / 4 字 82.1% / ≥5 字 99.7%。 */
    hero_fill_pct: +heroFillPct.toFixed(1),
    /* 闸门**只有横版有**：竖版这两项恒 null＝「量了，但没有闸门」，
       ⛔ 别读成 false（false 会被读成「判过了，没问题」）。 */
    hero_fill_min: LANDSCAPE ? HERO_FILL_MIN : null,
    /* ⛔ 带 heroAtMax 这个前提：见上面 HERO_FILL_MIN 那段——字号没顶在上限时，
       「加字」这个处置本身就不成立，那条告警就不该出。 */
    hero_fill_low: LANDSCAPE ? (heroAtMax && heroFillPct < HERO_FILL_MIN) : null,
    hero_at_max: heroAtMax,
    name_below_min: !!nm && nameFs < NAME_MIN - 0.01,
    name_min: NAME_MIN,
    role_below_min: !!rl && roleFs < ROLE_MIN - 0.01,
    ident_orn_overlap: identOrnHit,
    sub_ratio_ok: subFs ? (heroFs / subFs) >= 2.5 : null,
    sub_seg_overflow: subSegOverflow,
    step_over_sub: subFs ? stepFs > subFs + 0.5 : false,
    step_at_floor: stepFs <= STEP_FLOOR + 0.3,
    orn_unknown: ORN_UNKNOWN,
    orn_known: Object.keys(ORN),
    overflow_px: +Math.max(0, contentBottom() - bottomLine()).toFixed(1),
    safe_3x4_ok: !outOfSafe,
    crop_3x4: { y: Math.round(cut), h: Math.round(H - cut * 2) }
  };
};
</script>
</body>
</html>
