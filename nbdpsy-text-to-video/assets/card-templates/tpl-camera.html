<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>字卡短片 v4 · 一镜到底</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1920px; overflow:hidden; }
  body {
    background:#111820;
    font-family:"Noto Sans CJK SC","Source Han Sans SC","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
    letter-spacing:0;
    position:relative;
    -webkit-font-smoothing:antialiased;
  }

  /* ══════════ 舞台 / 摄影机 ══════════ */
  #stage { position:absolute; inset:0; overflow:hidden;
    background:
      radial-gradient(120% 70% at 50% 22%, #1E2A36 0%, #141C25 46%, #0C1219 100%); }

  #gate  { position:absolute; inset:0; }   /* 机身：撞击抖动 */
  #weave { position:absolute; inset:0; }   /* 片门：胶片轻微摆动 */

  /* 三个视差层：每层一个「零尺寸支点」，钉在画面正中 */
  .pivot { position:absolute; left:540px; top:960px; width:0; height:0; }
  #camBg { z-index:1; }
  #camMid{ z-index:2; }
  #camFg { z-index:3; }
  .world { position:absolute; left:0; top:0; }

  /* ── 远景层：大画布底纹 ── */
  #wBg { left:-1600px; top:-2400px; width:6000px; height:9000px;
    background-image:radial-gradient(rgba(168,181,196,.16) 2px, transparent 2px);
    background-size:78px 78px; }
  .blob { position:absolute; border-radius:50%; filter:blur(90px); }
  .rule { position:absolute; height:2px; background:rgba(168,181,196,.09); transform-origin:left center; }

  /* ── 中景层：卡片 + 线索 ── */
  #wMid { width:3800px; height:5800px; }
  #threads { position:absolute; left:0; top:0; width:3800px; height:5800px; z-index:1; }
  #threads line { stroke:#A34B3A; stroke-width:5; fill:none; stroke-linecap:round; opacity:.55; }
  #threads line.conv { stroke:#C97A4E; stroke-width:6; opacity:.72; }

  #blackout { position:absolute; left:-2100px; top:-3100px; width:8000px; height:12000px;
    background:#080C11; opacity:0; z-index:5; }

  .panel { position:absolute; background:#F2E9DC; color:#22303F;
    border-radius:28px; padding:80px;
    display:flex; flex-direction:column; justify-content:center;
    box-shadow:0 46px 110px rgba(0,0,0,.62), 0 0 0 3px rgba(242,233,220,.10);
    z-index:2; }
  .panel::after { content:""; position:absolute; left:0; top:0; right:0; height:10px;
    background:linear-gradient(90deg,#A34B3A,#C97A4E); border-radius:28px 28px 0 0; opacity:.85; }
  .idx { position:absolute; right:56px; top:44px; font-size:30px; font-weight:700;
    color:rgba(34,48,63,.30); font-variant-numeric:tabular-nums; }
  .ln  { font-weight:700; line-height:1.5; color:#22303F; }
  .em  { color:#A34B3A; font-weight:900; display:inline-block; }
  .u-wrap { position:relative; display:inline-block; }
  .uline { position:absolute; left:-6px; right:-6px; bottom:4px; height:12px;
    background:#A34B3A; border-radius:6px; opacity:.85; transform-origin:left center; transform:scaleX(0); }

  /* p0 夜聊 */
  .meta { font-size:38px; color:#6C7A89; font-weight:400; margin-bottom:30px; }
  .chat { margin-bottom:44px; }
  .bub { font-size:44px; line-height:1.35; padding:28px 40px; border-radius:28px; max-width:76%; }
  .b-me { background:#C6CEd7; color:#22303F; margin-left:auto; border-bottom-right-radius:8px; }
  .b-them { background:#FFFDF8; color:#22303F; border-bottom-left-radius:8px; margin-top:26px;
    box-shadow:0 6px 22px rgba(0,0,0,.10); position:relative; width:210px; height:104px; }
  .b-them > * { position:absolute; left:40px; top:50%; transform:translateY(-50%); }
  #dots { display:flex; gap:14px; }
  #dots i { width:17px; height:17px; border-radius:50%; background:#93A0AE; display:block; }
  #nn { font-size:52px; font-weight:900; color:#A34B3A; }

  /* p1 胶片 */
  .strip { position:relative; height:250px; margin-bottom:48px; overflow:hidden;
    border-radius:12px; background:#DCCFBC; }
  .track { position:absolute; left:0; top:22px; display:flex; gap:26px; }
  .fr { flex:none; width:270px; height:206px; border-radius:10px; background:#C8B79F;
    border:5px solid rgba(34,48,63,.16); position:relative; }
  .fr::before,.fr::after { content:""; position:absolute; left:10px; right:10px; height:12px;
    background-image:radial-gradient(rgba(34,48,63,.30) 4.5px, transparent 4.5px);
    background-size:34px 12px; }
  .fr::before { top:7px; } .fr::after { bottom:7px; }

  /* p2 静默点 */
  .quiet { display:flex; gap:18px; margin-bottom:34px; }
  .quiet i { width:20px; height:20px; border-radius:50%; background:#A34B3A; display:block; opacity:.30; }

  /* p3 值班灯 */
  .lamp { display:flex; align-items:center; gap:20px; margin-bottom:30px; }
  .lamp b { width:24px; height:24px; border-radius:50%; background:#A34B3A; display:block; }
  .lamp s { display:block; width:170px; height:3px; background:rgba(34,48,63,.20); text-decoration:none; }

  /* p4 焦点卡（反相） */
  /* 焦点卡必须压在压暗层(z5)之上，否则被自己的黑场吃掉 */
  #p4 { z-index:8; background:#141C25; box-shadow:0 60px 150px rgba(0,0,0,.85), 0 0 0 3px rgba(201,122,78,.28);
    padding:60px; align-items:flex-start; }
  #p4::after { background:linear-gradient(90deg,#D97757,#A34B3A); opacity:1; }
  #p4 .idx { color:rgba(242,233,220,.28); }
  #p4 .ln { color:#F2E9DC; font-weight:900; line-height:1.32; }
  #p4 .big { font-size:176px; color:#D97757; font-weight:900; line-height:1.14; display:block; }

  /* p5 雷达 */
  .radar { position:relative; width:420px; height:420px; margin:0 auto 46px; }
  .radar svg { position:absolute; inset:0; width:100%; height:100%; }
  #sweep { position:absolute; inset:0; border-radius:50%;
    background:conic-gradient(from 0deg, rgba(163,75,58,.42), rgba(163,75,58,0) 76deg, transparent 76deg); }
  .blip { position:absolute; width:20px; height:20px; border-radius:50%; background:#A34B3A; }

  /* p7 金句 */
  #p7 { align-items:flex-start; }
  .qm { font-size:118px; font-weight:900; color:#A34B3A; line-height:.8; }
  .qm.close { align-self:flex-end; }

  /* ── 前景层：散焦光斑 ── */
  #wFg { left:-1800px; top:-3400px; width:8400px; height:14400px; }
  .mote { position:absolute; border-radius:50%; }

  /* ══════════ 屏幕空间：光效 / 遮幅 / 字幕 ══════════ */
  #zoomlines { position:absolute; left:-30%; top:-30%; width:160%; height:160%; z-index:38; opacity:0;
    background:repeating-conic-gradient(from 0deg at 50% 50%,
      rgba(255,255,255,0) 0deg 2.6deg, rgba(255,255,255,.10) 2.6deg 3.2deg);
    -webkit-mask-image:radial-gradient(circle at 50% 50%, transparent 20%, #000 58%, #000 100%);
            mask-image:radial-gradient(circle at 50% 50%, transparent 20%, #000 58%, #000 100%); }
  #flash { position:absolute; inset:0; z-index:39; background:#F6EFE4; opacity:0; }
  #vignette { position:absolute; inset:0; z-index:40; pointer-events:none; opacity:.82;
    background:radial-gradient(120% 78% at 50% 46%, rgba(0,0,0,0) 38%, rgba(0,0,0,.62) 82%, rgba(0,0,0,.88) 100%); }
  #grain { position:absolute; inset:0; z-index:41; opacity:.055; pointer-events:none;
    background-image:radial-gradient(#DCCFBC 1px, transparent 1px); background-size:5px 5px; }

  /* 旁白字幕：整幅底部渐隐压光（电影字幕范式），不是硬边色块 */
  #capdim { position:absolute; left:0; right:0; bottom:0; height:1020px; z-index:43; opacity:0; pointer-events:none;
    background:linear-gradient(to top,
      rgba(5,8,11,.95) 0%, rgba(5,8,11,.90) 26%, rgba(5,8,11,.66) 52%, rgba(5,8,11,.28) 78%, rgba(5,8,11,0) 100%); }
  #caption { position:absolute; left:0; right:0; bottom:392px; z-index:44; text-align:center; opacity:0; }
  #caption p { position:relative; font-size:52px; line-height:1.62; color:#EFE6D8; font-weight:400;
    text-shadow:0 4px 26px rgba(0,0,0,.85); }

  #brand { position:absolute; left:0; right:0; bottom:236px; z-index:45; text-align:center;
    font-size:36px; color:#B9A991; font-weight:400; opacity:0; }

  .lb { position:absolute; left:0; right:0; height:134px; z-index:50; }
  #lbTop { top:0; transform-origin:50% 0%; }
  #lbBot { bottom:0; transform-origin:50% 100%; }
  .lb i { position:absolute; inset:0; background:#05080B; display:block; }
  #lbTop i { transform-origin:50% 0%; }
  #lbBot i { transform-origin:50% 100%; }

  #progress { position:absolute; left:120px; right:120px; bottom:96px; height:5px; z-index:55;
    background:rgba(233,222,205,.16); border-radius:3px; }
  #progress b { position:absolute; left:0; top:0; height:100%; width:100%; border-radius:3px;
    background:linear-gradient(90deg,#A34B3A,#D97757); transform-origin:left center; transform:scaleX(0); display:block; }
  #phead { position:absolute; left:-6px; top:50%; width:13px; height:13px; margin-top:-6.5px;
    border-radius:50%; background:#E7B183; box-shadow:0 0 14px rgba(217,119,87,.9); }
</style>
</head>
<body>

<div id="stage">
 <div id="gate"><div id="weave">

  <div class="pivot" id="camBg"><div class="world" id="wBg"></div></div>

  <div class="pivot" id="camMid"><div class="world" id="wMid">
    <svg id="threads" viewBox="0 0 3800 5800"></svg>
    <div id="blackout"></div>

    <!-- 01 深夜 -->
    <div class="panel" id="p0">
      <div class="idx">01</div>
      <div class="meta">晚上 11:00</div>
      <div class="chat">
        <div class="bub b-me" id="bb1">今天那个方案，我再改改哈</div>
        <div class="bub b-them" id="bb2">
          <span id="dots"><i></i><i></i><i></i></span>
          <span id="nn">嗯</span>
        </div>
      </div>
      <div class="ln" id="l0" style="font-size:80px">消息发出去，<br>对方只回了一个<span class="em">「嗯」</span></div>
    </div>

    <!-- 02 过电影 -->
    <div class="panel" id="p1">
      <div class="idx">02</div>
      <div class="strip"><div class="track" id="track"></div></div>
      <div class="ln" id="l1" style="font-size:78px">你开始一帧一帧<span class="em">过电影</span>：<br>白天那句话，<br>是不是说错了？</div>
    </div>

    <!-- 03 群里没人接话 -->
    <div class="panel" id="p2">
      <div class="idx">03</div>
      <div class="quiet" id="quiet"><i></i><i></i><i></i></div>
      <div class="ln" id="l2" style="font-size:84px">群里没人接话，<br>你<span class="u-wrap"><span class="em">先怀疑自己</span><em class="uline" id="ul2"></em></span></div>
    </div>

    <!-- 04 情绪值班 -->
    <div class="panel" id="p3">
      <div class="idx">04</div>
      <div class="lamp"><b id="lampdot"></b><s></s></div>
      <div class="ln" id="l3" style="font-size:82px">和人相处，<br>你总在替对方的<br>情绪<span class="u-wrap"><span class="em">值班</span><em class="uline" id="ul3"></em></span></div>
    </div>

    <!-- 05 焦点句 -->
    <div class="panel" id="p4">
      <div class="idx">05</div>
      <div class="ln" id="l4" style="font-size:130px">这不是</div>
      <div class="big" id="l4b">多心</div>
    </div>

    <!-- 06 雷达 -->
    <div class="panel" id="p5">
      <div class="idx">06</div>
      <div class="radar" id="radar">
        <svg viewBox="0 0 420 420">
          <circle id="rc1" cx="210" cy="210" r="66"  fill="none" stroke="#A34B3A" stroke-width="3" opacity=".55"/>
          <circle id="rc2" cx="210" cy="210" r="128" fill="none" stroke="#A34B3A" stroke-width="3" opacity=".42"/>
          <circle id="rc3" cx="210" cy="210" r="192" fill="none" stroke="#A34B3A" stroke-width="3" opacity=".30"/>
          <line id="rx" x1="18" y1="210" x2="402" y2="210" stroke="#A34B3A" stroke-width="2" opacity=".22"/>
          <line id="ry" x1="210" y1="18" x2="210" y2="402" stroke="#A34B3A" stroke-width="2" opacity=".22"/>
        </svg>
        <div id="sweep"></div>
        <div class="blip" id="bl1" style="left:112px; top:136px"></div>
        <div class="blip" id="bl2" style="left:292px; top:224px"></div>
        <div class="blip" id="bl3" style="left:186px; top:314px"></div>
      </div>
      <div class="ln" id="l5" style="font-size:78px">很多人小时候练出来的<br><span class="em">读脸色雷达</span>，<br>一开就是二十年</div>
    </div>

    <!-- 07 保护 / 紧张 -->
    <div class="panel" id="p6">
      <div class="idx">07</div>
      <div class="ln" id="l6" style="font-size:82px">它当年<span class="em">保护</span>过你，<br>现在却让你<br>替所有人<span class="em" id="jz">紧张</span></div>
    </div>

    <!-- 08 金句 -->
    <div class="panel" id="p7">
      <div class="idx">08</div>
      <div class="qm" id="qm1">「</div>
      <div class="ln" id="l7" style="font-size:88px; margin:14px 0 10px">我的雷达，<br>还在用<span class="em">旧方式</span><br>保护我</div>
      <div class="qm close" id="qm2">」</div>
    </div>

  </div></div>

  <div class="pivot" id="camFg"><div class="world" id="wFg"></div></div>

 </div></div>

 <div id="zoomlines"></div>
 <div id="flash"></div>
 <div id="vignette"></div>
 <div id="grain"></div>

 <div id="capdim"></div>
 <div id="caption"><p>下次脑补启动的那一刻，<br>试着叫出它的名字：</p></div>
 <div id="brand">NBDpsy 心理科普</div>

 <div class="lb" id="lbTop"><i></i></div>
 <div class="lb" id="lbBot"><i></i></div>
 <div id="progress"><b id="bar"></b><span id="phead"></span></div>
</div>

<script src="gsap.min.js"></script>
<script src="SplitText.min.js"></script>
<script src="DrawSVGPlugin.min.js"></script>
<script src="CustomEase.min.js"></script>
<script>
gsap.registerPlugin(SplitText, DrawSVGPlugin, CustomEase);

const CUES  = __CUES__;
const TAIL  = 1.8;
const total = CUES[CUES.length - 1].end + TAIL;
const C     = CUES;
const tl    = gsap.timeline({ paused: true });

CustomEase.create("camEase", "M0,0 C0.62,0.02 0.06,0.99 1,1");   // 电影运镜：起步沉、落位稳
CustomEase.create("camSoft", "M0,0 C0.38,0.02 0.10,1 1,1");      // 长距离拉远/推近

/* ══════════ 1. 大画布布局（世界坐标 3800×5800） ══════════ */
const CARDS = [
  { id:'p0', x: 900, y: 900, w:1000, h: 900, r:-1.6, s:0.86 },
  { id:'p1', x:2700, y:1150, w:1040, h: 960, r: 2.1, s:0.84 },
  { id:'p2', x:3100, y:2700, w:1000, h: 600, r:-1.2, s:0.90 },
  { id:'p3', x:2750, y:4250, w:1000, h: 700, r: 1.8, s:0.88 },
  { id:'p4', x:1700, y:4900, w: 660, h: 600, r: 0.0, s:1.55 },
  { id:'p5', x: 700, y:4150, w:1040, h:1120, r:-2.2, s:0.82 },
  { id:'p6', x: 600, y:2500, w:1000, h: 680, r: 1.4, s:0.88 },
  { id:'p7', x:1800, y:2800, w:1060, h: 900, r:-0.8, s:0.86 }
];
const P = {};
CARDS.forEach(c => {
  const el = document.getElementById(c.id);
  P[c.id] = el;
  el.style.left  = (c.x - c.w / 2) + 'px';
  el.style.top   = (c.y - c.h / 2) + 'px';
  el.style.width = c.w + 'px';
  el.style.height= c.h + 'px';
  gsap.set(el, { rotation: c.r });          // 静态摆放角度，时间轴不再触碰 transform
});

/* 远景装饰（写死数组，零随机） */
const BLOBS = [
  [ 300, 1400, 1500, '#2E4257', .30],
  [3600,  900, 1200, '#3A3140', .26],
  [4400, 4200, 1600, '#2B3E4E', .28],
  [ 900, 6200, 1400, '#3B3038', .24],
  [2600, 3200, 1800, '#243544', .30]
];
const wBg = document.getElementById('wBg');
BLOBS.forEach(([x, y, d, col, o]) => {
  const b = document.createElement('div'); b.className = 'blob';
  b.style.cssText = `left:${x}px;top:${y}px;width:${d}px;height:${d}px;background:${col};opacity:${o}`;
  wBg.appendChild(b);
});
const RULES = [[200,800,2600,14],[2200,2600,3000,-8],[600,5200,2800,6],[3000,6800,2400,-12]];
RULES.forEach(([x, y, w, a]) => {
  const r = document.createElement('div'); r.className = 'rule';
  r.style.cssText = `left:${x}px;top:${y}px;width:${w}px;transform:rotate(${a}deg)`;
  wBg.appendChild(r);
});

/* 前景散焦光斑（写死数组；高模糊低透明＝镜头前的浮尘，不夺字） */
const MOTES = [
  [ -900,  -600, 150, .16, 26, '#E0A878'],
  [  600,   400,  84, .13, 18, '#C9D6E0'],
  [ 2200,  1200, 190, .12, 30, '#E0A878'],
  [ 3900,   200,  96, .14, 20, '#C9D6E0'],
  [ 5200,  2100, 160, .11, 28, '#E0A878'],
  [ -400,  2600, 120, .15, 22, '#C9D6E0'],
  [ 1400,  3400, 210, .10, 34, '#E0A878'],
  [ 3200,  4200,  90, .14, 18, '#C9D6E0'],
  [ 5000,  5600, 170, .12, 28, '#E0A878'],
  [  200,  6200, 130, .13, 24, '#C9D6E0'],
  [ 2400,  7000, 200, .11, 32, '#E0A878'],
  [ 4200,  8000, 110, .14, 20, '#C9D6E0'],
  [ 1000,  9000, 180, .12, 30, '#E0A878'],
  [ 3400, 10200, 140, .13, 24, '#C9D6E0'],
  [ 5600,  9400, 100, .15, 18, '#E0A878'],
  [ -600,  4800, 160, .12, 28, '#C9D6E0'],
  [ 6400,  3000, 130, .13, 22, '#E0A878'],
  [ 1800,  5200, 105, .14, 20, '#C9D6E0'],
  [ 4600,  6600, 185, .11, 30, '#E0A878'],
  [ 2900,  2000,  92, .15, 16, '#C9D6E0'],
  [  100,  7800, 145, .12, 26, '#E0A878'],
  [ 6000, 11000, 175, .11, 30, '#C9D6E0'],
  [ 3800, 12200, 120, .13, 22, '#E0A878'],
  [ 1200, 11400,  98, .14, 18, '#C9D6E0']
];
const wFg = document.getElementById('wFg'), MOTE_EL = [];
MOTES.forEach(([x, y, d, o, bl, col]) => {
  const m = document.createElement('div'); m.className = 'mote';
  m.style.cssText = `left:${x + 1800}px;top:${y + 3400}px;width:${d}px;height:${d}px;` +
                    `background:${col};opacity:${o};filter:blur(${bl}px)`;
  wFg.appendChild(m); MOTE_EL.push(m);
});

/* 胶片格（p1） */
const track = document.getElementById('track');
for (let i = 0; i < 9; i++) { const f = document.createElement('div'); f.className = 'fr'; track.appendChild(f); }

/* 线索：旅程折线 + 终局向心线（DrawSVG 逐段描出） */
const svgNS = 'http://www.w3.org/2000/svg', SVG = document.getElementById('threads');
function mkLine(a, b, cls) {
  const l = document.createElementNS(svgNS, 'line');
  l.setAttribute('x1', a.x); l.setAttribute('y1', a.y);
  l.setAttribute('x2', b.x); l.setAttribute('y2', b.y);
  if (cls) l.setAttribute('class', cls);
  SVG.appendChild(l); return l;
}
const JOURNEY = [];                                   // 0→1 … 5→6，共 6 段
for (let i = 0; i < 6; i++) JOURNEY.push(mkLine(CARDS[i], CARDS[i + 1]));
const CONV = [];                                      // 七张卡 → 正中金句卡
for (let i = 0; i < 7; i++) CONV.push(mkLine(CARDS[i], CARDS[7], 'conv'));

/* 遮幅变形原点：显式写死，避免 GSAP 读取时机差异 */
gsap.set('#lbTop',   { transformOrigin:'50% 0%'   });
gsap.set('#lbBot',   { transformOrigin:'50% 100%' });
gsap.set('#lbTop i', { transformOrigin:'50% 0%'   });
gsap.set('#lbBot i', { transformOrigin:'50% 100%' });
gsap.set('.uline',   { transformOrigin:'left center' });
gsap.set('#sweep',   { transformOrigin:'50% 50%' });
gsap.set('#zoomlines', { transformOrigin:'50% 50%' });

/* ══════════ 2. 摄影机（三层视差 · 构建期显式记录每一段起止值） ══════════ */
const LAYERS = [
  { w:'#wBg',  p:'#camBg',  kt:0.45, kz:0.55, kr:0.45 },
  { w:'#wMid', p:'#camMid', kt:1.00, kz:1.00, kr:1.00 },
  { w:'#wFg',  p:'#camFg',  kt:1.15, kz:1.12, kr:1.16 }
];
let CAM = { x:CARDS[0].x, y:CARDS[0].y, s:CARDS[0].s, r:-CARDS[0].r };

function camState(L, c) {
  return { x:-c.x * L.kt, y:-c.y * L.kt, sc:Math.pow(c.s, L.kz), rot:c.r * L.kr };
}
/* 时间轴 0 秒把摄影机钉死在初始位姿（倒放/跳帧都可复原） */
LAYERS.forEach(L => {
  const a = camState(L, CAM);
  tl.set(L.w, { x:a.x, y:a.y }, 0);
  tl.set(L.p, { scale:a.sc, rotation:a.rot }, 0);
});

function camTo(t, dur, to, ease) {
  ease = ease || 'camEase';
  const from = CAM, next = { x:to.x, y:to.y, s:to.s, r:to.r };
  LAYERS.forEach(L => {
    const a = camState(L, from), b = camState(L, next);
    tl.fromTo(L.w, { x:a.x, y:a.y },
                   { x:b.x, y:b.y, duration:dur, ease, immediateRender:false }, t);
    tl.fromTo(L.p, { scale:a.sc, rotation:a.rot },
                   { scale:b.sc, rotation:b.rot, duration:dur, ease, immediateRender:false }, t);
  });
  CAM = next;
}
/* 停机位上的缓慢推移（Ken Burns），线性无缓动 */
function camDrift(t0, t1, d) {
  camTo(t0, Math.max(t1 - t0, 0.01),
        { x:CAM.x + (d.dx || 0), y:CAM.y + (d.dy || 0), s:CAM.s + (d.ds || 0), r:CAM.r + (d.dr || 0) },
        'none');
}
const shot = i => ({ x:CARDS[i].x, y:CARDS[i].y, s:CARDS[i].s, r:-CARDS[i].r });

/* ══════════ 3. 景深：非当前卡失焦 ══════════ */
const FOCUS = { opacity:1,   filter:'blur(0px)'  };
const REST  = { opacity:.30, filter:'blur(9px)'  };
const WIDE  = { opacity:.62, filter:'blur(3px)'  };
const DEEP  = { opacity:.16, filter:'blur(15px)' };
const HIDE  = { opacity:0,   filter:'blur(3px)'  };

function dof(el, t, dur, from, to) {
  tl.fromTo(el, { opacity:from.opacity, filter:from.filter },
                { opacity:to.opacity, filter:to.filter, duration:dur, ease:'power2.inOut', immediateRender:false }, t);
}
tl.set('#p0', FOCUS, 0);
for (let i = 1; i <= 6; i++) tl.set('#p' + i, REST, 0);
tl.set('#p7', HIDE, 0);

/* ══════════ 4. 运镜脚本（严格按时间顺序构建） ══════════ */
const M   = 0.80;                          // 常规运镜时长
const T1  = C[1].start - M;
const T2  = C[2].start - M;
const T3  = C[3].start - M;
const T4a = C[4].start - 0.82;             // 先拉远甩过去
const T4b = C[4].start - 0.28;             // 急推（撞击）
const T4c = C[4].start + 0.00;             // 落位回弹
const T5  = C[5].start - 0.72;
const T6  = C[6].start - M;
const TW  = C[6].end   - 0.45;             // 拉远揭全景
const TWe = TW + 1.70;
const QT  = C[7].start + 3.00;             // 金句语音起点
const TP  = QT - 1.30;                     // 推近金句（落位＝金句出口）
const TPe = TP + 1.30;

camDrift(0, T1, { ds:.035, dx:18, dy:10 });
camTo(T1, M, shot(1));                      dof('#p0', T1,        .42, FOCUS, REST); dof('#p1', T1 + M - .42, .48, REST, FOCUS);
camDrift(C[1].start, T2, { ds:.032, dx:-14, dy:8 });
camTo(T2, M, shot(2));                      dof('#p1', T2,        .42, FOCUS, REST); dof('#p2', T2 + M - .42, .48, REST, FOCUS);
camDrift(C[2].start, T3, { ds:.028, dx:10, dy:-8 });
camTo(T3, M, shot(3));                      dof('#p2', T3,        .42, FOCUS, REST); dof('#p3', T3 + M - .42, .48, REST, FOCUS);
camDrift(C[3].start, T4a, { ds:.035, dx:-12, dy:10 });

/* —— 焦点句：先脱离，再急推 —— */
camTo(T4a, 0.54, { x:CARDS[4].x, y:CARDS[4].y, s:0.42, r:-1.0 }, 'power2.inOut');
dof('#p3', T4a, .40, FOCUS, REST);
camTo(T4b, 0.28, { x:CARDS[4].x, y:CARDS[4].y, s:1.62, r:-2.4 }, 'power4.in');
dof('#p4', T4b, .28, REST, FOCUS);
camTo(T4c, 0.26, { x:CARDS[4].x, y:CARDS[4].y, s:1.52, r:-2.1 }, 'power2.out');
camDrift(T4c + 0.26, T5, { ds:.045, dr:.25 });

camTo(T5, 0.72, shot(5));                   dof('#p4', T5,        .42, FOCUS, REST); dof('#p5', T5 + .30, .48, REST, FOCUS);
camDrift(C[5].start, T6, { ds:.038, dx:14, dy:-10 });
camTo(T6, M, shot(6));                      dof('#p6', T6 + M - .42, .48, REST, FOCUS); dof('#p5', T6, .42, FOCUS, REST);
camDrift(C[6].start, TW, { ds:.032, dx:-10, dy:8 });

/* —— 金句：拉远揭全景 → 推近定格 —— */
camTo(TW, 1.70, { x:CARDS[7].x, y:CARDS[7].y, s:0.285, r:0 }, 'camSoft');
dof('#p6', TW, .70, FOCUS, WIDE);
for (let i = 0; i <= 5; i++) dof('#p' + i, TW + .25, .90, REST, WIDE);
dof('#p7', TWe - 0.60, .80, HIDE, WIDE);            // 正中先亮出一张空白卡
camDrift(TWe, TP, { ds:-.013, dr:.7 });
camTo(TP, 1.30, shot(7), 'camSoft');
for (let i = 0; i <= 6; i++) dof('#p' + i, TP, .90, WIDE, DEEP);
dof('#p7', TP + .35, .80, WIDE, FOCUS);
camDrift(TPe, total, { ds:.052, dy:-14 });

/* ══════════ 5. 线索描出 ══════════ */
[[JOURNEY[0], T1], [JOURNEY[1], T2], [JOURNEY[2], T3], [JOURNEY[3], T4a],
 [JOURNEY[4], T5], [JOURNEY[5], T6]].forEach(([l, t]) => {
  tl.set(l, { drawSVG:'0% 0%' }, 0);
  tl.fromTo(l, { drawSVG:'0% 0%' }, { drawSVG:'0% 100%', duration:0.85, ease:'power2.inOut', immediateRender:false }, t);
});
CONV.forEach((l, i) => {
  tl.set(l, { drawSVG:'0% 0%', opacity:.72 }, 0);
  tl.fromTo(l, { drawSVG:'0% 0%' }, { drawSVG:'0% 100%', duration:0.70, ease:'power2.out', immediateRender:false }, TWe - 0.55 + i * 0.075);
  tl.fromTo(l, { opacity:.72 }, { opacity:.14, duration:.9, ease:'power2.inOut', immediateRender:false }, TP + .2);
});

/* ══════════ 6. 逐卡内容动效 ══════════ */
function rise(sel, t, opt) {
  opt = opt || {};
  const sp = new SplitText(sel, { type:'chars' });
  tl.set(sp.chars, { opacity:0, y:opt.dy || 44 }, 0);
  tl.fromTo(sp.chars, { opacity:0, y:opt.dy || 44 },
    { opacity:1, y:0, duration:opt.dur || .52, stagger:opt.st || .030,
      ease:opt.ease || 'power3.out', immediateRender:false }, t);
  return sp;
}

/* 01 深夜对话 */
{
  const s = C[0].start;
  tl.set('#bb1', { opacity:0, x:110 }, 0);
  tl.set('#bb2', { opacity:0, x:-110 }, 0);
  tl.set('#nn',  { opacity:0, scale:0 }, 0);
  tl.set('.meta',{ opacity:0, y:-22 }, 0);
  tl.set('#dots i', { opacity:.28 }, 0);
  tl.fromTo('.meta', { opacity:0, y:-22 }, { opacity:1, y:0, duration:.40, ease:'power2.out', immediateRender:false }, s + .02);
  tl.fromTo('#bb1', { opacity:0, x:110 },  { opacity:1, x:0, duration:.46, ease:'power3.out', immediateRender:false }, s + .14);
  tl.fromTo('#bb2', { opacity:0, x:-110 }, { opacity:1, x:0, duration:.46, ease:'power3.out', immediateRender:false }, s + .82);
  tl.fromTo('#dots i', { opacity:.28 },
    { opacity:1, duration:.20, ease:'sine.inOut', immediateRender:false,
      stagger:{ each:.16, repeat:5, yoyo:true } }, s + .95);
  rise('#l0', s + 1.25, { st:.028 });
  tl.fromTo('#dots', { opacity:1 }, { opacity:0, duration:.22, immediateRender:false }, s + 3.45);
  tl.fromTo('#nn', { opacity:0, scale:0 }, { opacity:1, scale:1, duration:.55, ease:'back.out(2.6)', immediateRender:false }, s + 3.50);
}

/* 02 过电影：胶片横移 */
{
  const s = C[1].start, e = C[1].end;
  rise('#l1', s + .10, { st:.026 });
  tl.set('#track', { x:0 }, 0);
  tl.fromTo('#track', { x:0 }, { x:-1180, duration:e - s + .5, ease:'none', immediateRender:false }, s - .3);
}

/* 03 群里没人接话 */
{
  const s = C[2].start;
  rise('#l2', s + .08, { st:.028 });
  tl.set('#ul2', { scaleX:0 }, 0);
  tl.fromTo('#ul2', { scaleX:0 }, { scaleX:1, duration:.55, ease:'power2.inOut', immediateRender:false }, s + 1.15);
  tl.set('#quiet i', { opacity:.30 }, 0);
  tl.fromTo('#quiet i', { opacity:.30 },
    { opacity:.85, duration:.32, ease:'sine.inOut', immediateRender:false,
      stagger:{ each:.22, repeat:5, yoyo:true } }, s + .15);
}

/* 04 情绪值班 */
{
  const s = C[3].start;
  rise('#l3', s + .08, { st:.028 });
  tl.set('#ul3', { scaleX:0 }, 0);
  tl.fromTo('#ul3', { scaleX:0 }, { scaleX:1, duration:.55, ease:'power2.inOut', immediateRender:false }, s + 1.55);
  tl.set('#lampdot', { opacity:1, scale:1 }, 0);
  tl.fromTo('#lampdot', { opacity:1, scale:1 },
    { opacity:.25, scale:.72, duration:.55, ease:'sine.inOut', repeat:5, yoyo:true, immediateRender:false }, s + .25);
}

/* 05 焦点句：压暗 + 撞击 + 变焦线 + 机身抖动 */
{
  const s = C[4].start, e = C[4].end;
  tl.set('#blackout', { opacity:0 }, 0);
  tl.set('#camFg', { opacity:1 }, 0);
  tl.set('#zoomlines', { opacity:0, scale:1 }, 0);
  tl.set('#flash', { opacity:0 }, 0);

  tl.fromTo('#blackout', { opacity:0 }, { opacity:.90, duration:.26, ease:'power3.in', immediateRender:false }, T4b);
  tl.fromTo('#camFg', { opacity:1 }, { opacity:.30, duration:.30, ease:'power2.in', immediateRender:false }, T4b);
  tl.fromTo('#zoomlines', { opacity:0, scale:1 }, { opacity:.85, scale:1.55, duration:.30, ease:'power3.in', immediateRender:false }, T4b);
  tl.fromTo('#zoomlines', { opacity:.85, scale:1.55 }, { opacity:0, scale:2.1, duration:.34, ease:'power2.out', immediateRender:false }, T4b + .30);
  tl.fromTo('#flash', { opacity:0 }, { opacity:.42, duration:.06, ease:'none', immediateRender:false }, s - .02);
  tl.fromTo('#flash', { opacity:.42 }, { opacity:0, duration:.30, ease:'power2.out', immediateRender:false }, s + .04);
  tl.fromTo('#gate', { x:0, y:0 }, { x:15, y:-10, duration:.055, repeat:7, yoyo:true, ease:'none', immediateRender:false }, s);
  tl.set('#gate', { x:0, y:0 }, s + .50);

  tl.set('#l4b', { opacity:0, scale:.55, y:40 }, 0);
  rise('#l4', s + .04, { st:.085, dy:70, dur:.55, ease:'back.out(1.8)' });
  tl.fromTo('#l4b', { opacity:0, scale:.55, y:40 },
    { opacity:1, scale:1, y:0, duration:.62, ease:'back.out(2.2)', immediateRender:false }, s + .30);

  tl.fromTo('#blackout', { opacity:.90 }, { opacity:0, duration:.60, ease:'power2.inOut', immediateRender:false }, e - .18);
  tl.fromTo('#camFg', { opacity:.30 }, { opacity:1, duration:.60, ease:'power2.inOut', immediateRender:false }, e - .18);
  /* 遮幅在焦点句夹紧再松开 */
  tl.fromTo('.lb', { scaleY:1 }, { scaleY:1.30, duration:.34, ease:'power3.out', immediateRender:false }, T4b);
  tl.fromTo('.lb', { scaleY:1.30 }, { scaleY:1, duration:.70, ease:'power2.inOut', immediateRender:false }, e - .10);
  /* 暗角随之收紧 */
  tl.set('#vignette', { opacity:.82 }, 0);
  tl.fromTo('#vignette', { opacity:.82 }, { opacity:1, duration:.30, ease:'power2.in',  immediateRender:false }, T4b);
  tl.fromTo('#vignette', { opacity:1 }, { opacity:.82, duration:.70, ease:'power2.inOut', immediateRender:false }, e - .10);
}

/* 06 雷达 */
{
  const s = C[5].start, e = C[5].end;
  ['#rc1', '#rc2', '#rc3'].forEach((id, i) => {
    tl.set(id, { drawSVG:'0% 0%' }, 0);
    tl.fromTo(id, { drawSVG:'0% 0%' }, { drawSVG:'0% 100%', duration:.55 + i * .12, ease:'power2.out', immediateRender:false }, s + .10 + i * .16);
  });
  tl.set('#sweep', { rotation:0 }, 0);
  tl.fromTo('#sweep', { rotation:0 }, { rotation:360 * 2.4, duration:e - s, ease:'none', immediateRender:false }, s);
  rise('#l5', s + .35, { st:.026 });
  [['#bl1', 1.25], ['#bl2', 2.10], ['#bl3', 3.05]].forEach(([id, dt]) => {
    tl.set(id, { opacity:0, scale:.4 }, 0);
    tl.fromTo(id, { opacity:0, scale:.4 }, { opacity:1, scale:1, duration:.26, ease:'back.out(2)', immediateRender:false }, s + dt);
    tl.fromTo(id, { opacity:1 }, { opacity:0, duration:.65, ease:'power2.in', immediateRender:false }, s + dt + .55);
  });
}

/* 07 保护 / 紧张 */
{
  const s = C[6].start;
  rise('#l6', s + .08, { st:.028 });
  tl.set('#jz', { x:0 }, 0);
  tl.fromTo('#jz', { x:0 }, { x:5, duration:.07, repeat:13, yoyo:true, ease:'none', immediateRender:false }, s + 2.20);
  tl.set('#jz', { x:0 }, s + 3.30);
}

/* 08 金句 + 落款 + 旁白字幕 */
{
  const s = C[7].start, e = C[7].end;
  tl.set('#caption', { opacity:0, y:26 }, 0);
  tl.set('#capdim',  { opacity:0 }, 0);
  tl.fromTo('#capdim',  { opacity:0 }, { opacity:1, duration:.90, ease:'power2.out', immediateRender:false }, s + .05);
  tl.fromTo('#caption', { opacity:0, y:26 }, { opacity:1, y:0, duration:.70, ease:'power2.out', immediateRender:false }, s + .15);
  tl.fromTo('#caption', { opacity:1, y:0 }, { opacity:0, y:-22, duration:.55, ease:'power2.in', immediateRender:false }, TP - .55);
  tl.fromTo('#capdim',  { opacity:1 }, { opacity:0, duration:.75, ease:'power2.inOut', immediateRender:false }, TP - .40);

  tl.set('#qm1', { opacity:0, scale:.4 }, 0);
  tl.set('#qm2', { opacity:0, scale:.4 }, 0);
  tl.fromTo('#qm1', { opacity:0, scale:.4 }, { opacity:1, scale:1, duration:.55, ease:'back.out(1.9)', immediateRender:false }, QT - .30);
  rise('#l7', QT - .16, { st:.055, dy:62, dur:.58 });
  tl.fromTo('#qm2', { opacity:0, scale:.4 }, { opacity:1, scale:1, duration:.55, ease:'back.out(1.9)', immediateRender:false }, QT + 1.25);

  tl.set('#brand', { opacity:0, y:16 }, 0);
  tl.fromTo('#brand', { opacity:0, y:16 }, { opacity:1, y:0, duration:.85, ease:'power2.out', immediateRender:false }, e - 1.50);
}

/* ══════════ 7. 全片氛围：片门摆动 / 遮幅呼吸 / 浮尘 / 进度 ══════════ */
tl.set('#weave', { x:0, y:0 }, 0);
tl.fromTo('#weave', { x:-1.1 }, { x:1.1, duration:2.6, ease:'sine.inOut',
  repeat:Math.ceil(total / 2.6) + 1, yoyo:true, immediateRender:false }, 0);
tl.fromTo('#weave', { y:-0.9 }, { y:0.9, duration:3.4, ease:'sine.inOut',
  repeat:Math.ceil(total / 3.4) + 1, yoyo:true, immediateRender:false }, 0);

tl.set('.lb', { scaleY:1 }, 0);
tl.set('.lb i', { scaleY:1 }, 0);
tl.fromTo('.lb i', { scaleY:1 }, { scaleY:1.05, duration:2.1, ease:'sine.inOut',
  repeat:Math.ceil(total / 2.1) + 1, yoyo:true, immediateRender:false }, 0);

MOTE_EL.forEach((m, i) => {
  const dy = -(260 + (i % 5) * 90);
  tl.set(m, { y:0 }, 0);
  tl.fromTo(m, { y:0 }, { y:dy, duration:total, ease:'none', immediateRender:false }, 0);
});

tl.set('#bar', { scaleX:0 }, 0);
tl.set('#phead', { x:0 }, 0);
tl.fromTo('#bar', { scaleX:0 }, { scaleX:1, duration:total, ease:'none', immediateRender:false }, 0);
tl.fromTo('#phead', { x:0 }, { x:840, duration:total, ease:'none', immediateRender:false }, 0);

/* ══════════ 8. 渲染器接口 ══════════ */
window.TOTAL = total;
window.SEEK  = t => { tl.seek(Math.min(t, total - 0.001), false); };
</script>
</body>
