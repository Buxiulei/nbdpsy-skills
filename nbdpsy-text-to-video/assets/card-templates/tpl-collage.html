<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>字卡短片 v5 · 手作拼贴</title>
<style>

  html,body { width:1080px; height:1920px; overflow:hidden; }

  #stage{ position:absolute; inset:0; z-index:2; }

  .scrap{ position:absolute; opacity:0;
    box-shadow:0 16px 32px rgba(94,70,40,.16), 0 3px 6px rgba(94,70,40,.13); }
  .white{ background:#FCF8F1; }

  .grid{ background:#F3F5EF;

    background-size:40px 40px; }

  .em{ color:#B4362B; }
  .l2{ display:inline-block; opacity:0; }

  .tape.tr{ right:-48px; top:-22px; transform:rotate(38deg); }
  .tape.tc{ left:50%; margin-left:-84px; top:-26px; transform:rotate(-2.2deg); }

  .dot{ position:absolute; border-radius:50%;
    box-shadow:0 3px 7px rgba(90,68,38,.22), inset 0 -5px 9px rgba(0,0,0,.07); }

  .mk{ position:relative; display:inline-block; }
  .mk > svg{ position:absolute; overflow:visible; pointer-events:none; z-index:2; }
  .ch{ display:inline-block; }

  /* ══ 常驻散件（只落在页边，永不压字） ══ */

  /* ══ c0 ══ */

  /* ══ c1 ══ */

  #c1b{ left:120px; top:1000px; width:880px; padding:50px 54px; font-size:62px; }
  .frm{ position:absolute; width:200px; padding:12px 12px 0; background:#FDFBF6; opacity:0;

  .frm .ph{ height:190px; background:linear-gradient(158deg,#A2ADB3,#6C7780); }
  .frm .cap{ height:44px; }

  /* ══ c2 ══ */
  .slip{ position:absolute; height:92px; padding:26px 30px; opacity:0; }

  #stamp{ position:absolute; left:160px; top:690px; width:760px; height:500px; opacity:0; }

  .blip{ position:absolute; border-radius:50%; background:#B4362B; opacity:0; }
  #c5a{ left:80px; top:960px; width:920px; padding:54px 58px; font-size:66px; }

               linear-gradient(180deg, #E7D0A0, #D3B478);
    box-shadow:0 3px 6px rgba(90,68,38,.20); }
  #pin{ position:absolute; left:-11px; top:-13px; width:24px; height:40px; border-radius:3px;

    box-shadow:0 3px 6px rgba(90,68,38,.24); }

  .card{ position:absolute; inset:0; opacity:0; z-index:4; }
</style>
</head>

<script>
gsap.registerPlugin(SplitText, DrawSVGPlugin, CustomEase);

const CUES = __CUES__;
const TAIL = 1.8;
const total = CUES[CUES.length - 1].end + TAIL;
const tl = gsap.timeline({ paused: true });

/* 手写笔触 ease：起笔快、行笔顿一下、收笔稳 */
CustomEase.create("pen", "M0,0 C0.12,0.36 0.2,0.68 0.36,0.8 0.52,0.92 0.6,0.9 0.72,0.94 0.84,0.98 0.9,1 1,1");

const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const NS = "http://www.w3.org/2000/svg";
const node = e => (typeof e === "string" ? document.querySelector(e) : e);
const rotOf = e => parseFloat(node(e).dataset.rot || 0);

/* ══════════ 手绘路径生成（纯确定性公式，无 Math.random / Date.now） ══════════ */
function handOval(cx, cy, rx, ry, turns, ph, amp){
  const k = (amp === undefined ? 1 : amp);
  const N = Math.round(70 * turns), a0 = -0.55 + ph, a1 = a0 + Math.PI * 2 * turns;
  let d = "";
  for (let i = 0; i <= N; i++){
    const a = a0 + (a1 - a0) * i / N;
    const w = 1 + k * (0.048 * Math.sin(a * 3 + ph * 2.1) + 0.022 * Math.sin(a * 7 + 1.3));
    const x = cx + rx * w * Math.cos(a) + 2.4 * k * Math.sin(a * 5 + ph);
    const y = cy + ry * w * Math.sin(a) + 1.9 * k * Math.cos(a * 6 + ph * 1.7);
    d += (i ? "L" : "M") + x.toFixed(1) + "," + y.toFixed(1);
  }
  return d;
}
function handRect(x, y, w, h, ph){
  const P = [[x,y],[x+w,y],[x+w,y+h],[x,y+h],[x,y],[x+w*0.2,y-3]];
  let d = "M" + x.toFixed(1) + "," + y.toFixed(1);
  for (let s = 0; s < P.length - 1; s++){
    const a = P[s], b = P[s+1], N = 12;
    for (let i = 1; i <= N; i++){
      const t = i / N;
      const jx = 2.5 * Math.sin(t * 6.1 + s * 2.3 + ph), jy = 2.5 * Math.cos(t * 5.3 + s * 1.7 + ph);
      d += "L" + (a[0] + (b[0]-a[0]) * t + jx).toFixed(1) + "," + (a[1] + (b[1]-a[1]) * t + jy).toFixed(1);
    }
  }
  return d;
}
function handWave(x, y, w, amp, cycles, ph){
  const N = 76; let d = "";
  for (let i = 0; i <= N; i++){
    const t = i / N;
    const px = x + w * t;
    const py = y + amp * Math.sin(t * Math.PI * 2 * cycles + ph) + 1.7 * Math.sin(t * 17 + ph);
    d += (i ? "L" : "M") + px.toFixed(1) + "," + py.toFixed(1);
  }
  return d;
}
function handLine(x0, y0, x1, y1, ph, amp){
  const N = 24; let d = "";
  const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy) || 1;
  const nx = -dy / L, ny = dx / L;
  for (let i = 0; i <= N; i++){
    const t = i / N;
    const off = (amp === undefined ? 2 : amp) * Math.sin(t * 5.4 + ph) * Math.sin(t * Math.PI);
    d += (i ? "L" : "M") + (x0 + dx * t + nx * off).toFixed(1) + "," + (y0 + dy * t + ny * off).toFixed(1);
  }
  return d;
}
/* 曲线箭头：返回 [杆, 头] 两条路径 d */
function handArrow(x0, y0, cx, cy, x1, y1, ph, hs){
  const N = 44; let d = "", lx = x0, ly = y0, px = x0, py = y0;
  for (let i = 0; i <= N; i++){
    const t = i / N, mt = 1 - t;
    const x = mt*mt*x0 + 2*mt*t*cx + t*t*x1 + 1.7 * Math.sin(t * 9 + ph);
    const y = mt*mt*y0 + 2*mt*t*cy + t*t*y1 + 1.7 * Math.cos(t * 8 + ph);
    if (i === N - 1){ lx = x; ly = y; }
    if (i === N){ px = x; py = y; }
    d += (i ? "L" : "M") + x.toFixed(1) + "," + y.toFixed(1);
  }
  const ang = Math.atan2(py - ly, px - lx), s = hs || 30;
  const h1x = px - s * Math.cos(ang - 0.42), h1y = py - s * Math.sin(ang - 0.42);
  const h2x = px - s * Math.cos(ang + 0.42), h2y = py - s * Math.sin(ang + 0.42);
  const head = "M" + h1x.toFixed(1) + "," + h1y.toFixed(1) +
               "L" + px.toFixed(1) + "," + py.toFixed(1) +
               "L" + h2x.toFixed(1) + "," + h2y.toFixed(1);
  return [d, head];
}
/* 把若干 path 塞进一个绝对定位 svg */
function svgIn(host, w, h, ds, color, sw, style){
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 " + w + " " + h);
  svg.style.cssText = "position:absolute;left:0;top:0;width:" + w + "px;height:" + h + "px;overflow:visible;" + (style || "");
  const out = [];
  ds.forEach(d => {
    const p = document.createElementNS(NS, "path");
    p.setAttribute("d", d); p.setAttribute("fill", "none");
    p.setAttribute("stroke", color); p.setAttribute("stroke-width", sw);
    p.setAttribute("stroke-linecap", "round"); p.setAttribute("stroke-linejoin", "round");
    svg.appendChild(p); out.push(p);
  });
  host.appendChild(svg);
  return out;
}

/* ══════════ 自建字符切分（保留 .mk / <br> 等子元素，比 SplitText 更可控） ══════════ */
function splitChars(root){
  const out = [];
  (function walk(node){
    Array.from(node.childNodes).forEach(n => {
      if (n.nodeType === 3){
        const frag = document.createDocumentFragment();
        Array.from(n.nodeValue).forEach(c => {
          if (c === " "){ frag.appendChild(document.createTextNode(c)); return; }
          const s = document.createElement("span");
          s.className = "ch"; s.textContent = c;
          frag.appendChild(s); out.push(s);
        });
        n.parentNode.replaceChild(frag, n);
      } else if (n.nodeType === 1 && n.tagName !== "BR"){
        walk(n);
      }
    });
  })(root);
  return out;
}

function seed(el, from){ tl.set(el, from, 0); }
function play(el, from, to, at){

}

    { opacity:1, x:0, y:0, rotation:r, scale:1,
      duration:(o.d || 0.6), ease:"back.out(1.5)" }, at);

  // 金句：口播 +3.0s 起逐字写上，带固定手写抖动
  const JIT = [0.34,-0.71,0.52,-0.19,0.85,-0.43,0.14,-0.9,0.61,-0.26,0.77,-0.58,0.06,-0.82,0.4,-0.35];
  quoteChars.forEach((ch, i) => {
    const rr = JIT[i % JIT.length] * 2.6, yy = JIT[(i + 7) % JIT.length] * 5;
    play(ch, { opacity:0, y:yy + 20, scale:0.84, rotation:rr, transformOrigin:"50% 80%" },
             { opacity:1, y:yy, scale:1, rotation:rr, duration:0.34, ease:"back.out(2)" },
         s + 3.0 + i * 0.055);
  });
  draw(MK.mkOld, s + 4.7, 0.55);
  paste("#sticker", s + 5.5, { dr:-11, d:0.55 });
  // 尾部定格：信纸极缓推近
  play("#letter", { scale:1 }, { scale:1.022, duration:total - (s + 3.1), ease:"none" }, s + 3.1);
  tl.to("#brand", { opacity:1, duration:0.9, ease:"power2.out" }, E(7) - 0.7);
}

/* ══ 进度：纸胶带贴过去，一枚小夹子领着走 ══ */
play("#bar", { scaleX:0 }, { scaleX:1, duration:total, ease:"none" }, 0);
play("#pin", { x:0 },      { x:888,   duration:total, ease:"none" }, 0);

window.TOTAL = total;
window.SEEK  = t => { tl.seek(Math.min(t, total - 0.001), false); };
</script>
